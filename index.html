<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="小遊戲">
<meta name="theme-color" content="#f5ecdc">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="style.css">
<title>小遊戲合集</title>
</head>
<body>
<div id="menu" class="screen">
  <header class="menu-head">
    <h1>小遊戲合集</h1>
    <button id="muteBtn" class="round" aria-label="聲音">🔊</button>
  </header>
  <div class="menu-sub">31 款小遊戲 · 冇網都玩得</div>
  <a class="feature" href="farm/">
    <img src="thumbs/farm.jpg" alt="">
    <span class="ftx"><span class="fnew">新遊戲 · 3D</span><b>開心農場鋪</b><small>割草、養雞、開店、請員工</small></span>
  </a>
  <div id="grid"></div>
</div>

<div id="picker" class="hidden">
  <div class="sheet">
    <button id="pkClose" class="round pk-x" aria-label="關閉">×</button>
    <img id="pkThumb" alt="">
    <div id="pkName"></div>
    <div id="pkModes"></div>
  </div>
</div>

<div id="play" class="screen hidden">
  <div class="topbar">
    <button id="backBtn" class="round" aria-label="返回">‹</button>
    <div class="title"><div id="gTitle"></div><div id="gLevel"></div></div>
    <button id="restartBtn" class="round" aria-label="重來">↻</button>
  </div>
  <div id="info"></div>
  <div id="stage"><canvas id="cv"></canvas></div>
  <div id="overlay" class="hidden">
    <div class="card">
      <div id="ovTitle"></div>
      <div id="ovText"></div>
      <div class="btns">
        <button id="ovMenu" class="btn ghost small" aria-label="選單">☰</button>
        <button id="ovRetry" class="btn ghost">重來</button>
        <button id="ovNext" class="btn">下一關</button>
      </div>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script src="games/bus.js"></script>
<script src="games/water.js"></script>
<script src="games/zombie.js"></script>
<script src="games/crowd.js"></script>
<script src="games/parking.js"></script>
<script src="games/screw.js"></script>
<script src="games/blocks.js"></script>
<script src="games/arrows.js"></script>
<script src="games/triple.js"></script>
<script src="games/pins.js"></script>
<script src="games/pixel.js"></script>
<script src="games/fruit.js"></script>
<script src="games/stack.js"></script>
<script src="games/tangle.js"></script>
<script src="games/bricks.js"></script>
<script src="games/runner.js"></script>
<script src="games/hole.js"></script>
<script src="games/survivor.js"></script>
<script src="games/bubble.js"></script>
<script src="games/snake.js"></script>
<script src="games/helix.js"></script>
<script src="games/knife.js"></script>
<script src="games/bullet.js"></script>
<script src="games/merge.js"></script>
<script src="games/paper.js"></script>
<script src="games/flow.js"></script>
<script src="games/ninja.js"></script>
<script src="games/piano.js"></script>
<script src="games/g2048.js"></script>
<script src="games/jumper.js"></script>
<script src="games/multiply.js"></script>
<script>MG.start();</script>
</body>
</html>
