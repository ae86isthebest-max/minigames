  front(p,g,t){ const dark = 1 - OBJ.light; if (dark < 0.02) return; g.save(); g.globalAlpha = dark * 0.62; g.fillStyle = "#06081a"; g.fillRect(0,0,256,192); g.restore();
    if (OBJ.lamp > 0.5){ g.save(); g.globalCompositeOperation = "lighter"; const gr = g.createRadialGradient(75,82,2,75,82,46); gr.addColorStop(0,`rgba(255,220,140,${0.42*dark})`); gr.addColorStop(1,"rgba(255,220,140,0)"); g.fillStyle = gr; g.fillRect(25,36,100,96); g.restore(); } },

function paving(p,x0,y0,w,h){ p.R(x0,y0,w,h,"#b8b2a4"); for(let x=x0;x<x0+w;x+=16) p.R(x,y0,1,h,"#9e988a"); for(let y=y0;y<y0+h;y+=10) p.R(x0,y,w,1,"#9e988a"); }

let maidTalk = 0;
