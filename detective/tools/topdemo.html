<script>
const OUTC = "#1a1410";

function block(p, x, y, w, h, d, top, front){ p.R(x-1, y-1, w+2, h+d+2, OUTC); p.R(x, y, w, h, top); p.R(x, y+h, w, d, front); p.R(x, y+h, w, 1, OUTC); p.R(x, y, w, 1, PX.prim.shade ? top : top); }
function rug(p,x,y,w,h){ p.R(x,y,w,h,"#c9a45a"); p.R(x+2,y+2,w-4,h-4,"#6e2f36"); for(let i=x+6;i<x+w-6;i+=10) for(let j=y+6;j<y+h-6;j+=8) p.R(i,j,4,3,"#8e4a4a"); }
function planks(p,x0,y0,w,h){ p.R(x0,y0,w,h,"#8a6440"); for(let x=x0;x<x0+w;x+=12){ p.R(x,y0,1,h,"#6e4e30"); for(let y=y0+((x/12)%3)*14;y<y0+h;y+=40) p.R(x,y,12,1,"#6e4e30"); } for(let x=x0+3;x<x0+w;x+=12) for(let y=y0;y<y0+h;y+=7) if(((x*7+y*13)%11)===0) p.R(x,y,3,1,"#9a7450"); }
function wallFace(p,w,h,col){ p.R(0,0,w,h,col); for(let x=0;x<w;x+=28) p.R(x,0,1,h-4,"#b8a37e"); p.R(0,h-4,w,4,"#5a3e28"); p.R(0,h-4,w,1,OUTC); }
const study = { name:"書房", w:256, h:192, wall:58,
  floor(p,g,t){ wallFace(p,256,58,"#cbb894"); planks(p,0,58,256,134);
    // 窗
    p.R(96,10,48,34,OUTC); p.R(98,12,44,30,"#3a2a1c"); p.R(100,14,40,26,"#24345a"); p.R(119,14,2,26,"#3a2a1c"); p.R(100,26,40,2,"#3a2a1c"); p.R(128,17,5,5,"#f2ecd0"); p.R(101,15,8,1,"#3c5488"); p.R(94,44,52,3,"#7a5232");

  },
  props:[
    { y:58, draw(p){ // 書櫃（靠牆）
      p.R(176,4,44,58,OUTC); p.R(178,6,40,54,"#4a3020"); for(let r=0;r<4;r++){ p.R(180,9+r*12,36,9,"#33200f"); ["#8a3a3a","#3a5a8a","#c9a45a","#3e7a52","#7a4a8a","#a8662a","#8a3a3a","#3a5a8a"].forEach((c,b)=>p.R(181+b*4+(b>3?2:0),10+r*12+(b%3===1?1:0),3,8-(b%3===1?1:0),c)); } } },
    { y:104, draw(p,g,t){ // 書桌

    { y:118, draw(p){ p.R(86,104,24,14,OUTC); p.R(87,105,22,9,"#5a3a22"); p.R(88,114,3,4,"#3e2716"); p.R(105,114,3,4,"#3e2716"); } },   // 椅

  floor(p){ wallFace(p,320,58,"#b9c4b0"); planks(p,0,58,320,134); p.R(0,110,6,60,"#1a1410"); p.R(0,112,4,56,"#3a2c22"); p.R(246,14,30,44,OUTC); p.R(248,16,26,42,"#1a1410"); p.R(248,16,8,42,"#6a4428"); p.R(40,20,40,26,"#3a2a1c"); p.R(42,22,36,22,"#7a8a5a"); },
  props:[], solid:[], exits:[ { r:[248,58,26,8], to:"study", at:[29,72], label:"書房", kind:"door" }, { r:[4,120,8,40], to:"street", at:[150,92], label:"出去", kind:"out", art:[0,110,16,60] } ] };
const up = { name:"地下室", w:256, h:192, wall:50,
  floor(p){ wallFace(p,256,50,"#8a8a86"); p.R(0,50,256,142,"#6a6a66"); for(let x=0;x<256;x+=16) for(let y=50;y<192;y+=16) p.R(x,y,16,1,"#5a5a56"), p.R(x,y,1,16,"#5a5a56"); p.R(30,150,52,40,"#3a3a36"); for(let i=0;i<6;i++) p.R(32,186-i*6,48,5,"#7a7a76"); },

// 街：上面是大廈外牆（入口）、行人路、馬路（斑馬線、中線）、對面行人路；有泊著的巡邏車和駛過的車
function paving(p,x0,y0,w,h){ p.R(x0,y0,w,h,"#b8b2a4"); for(let x=x0;x<x0+w;x+=16) p.R(x,y0,1,h,"#9e988a"); for(let y=y0;y<y0+h;y+=10) p.R(x0,y,w,1,"#9e988a"); }
const street = { name:"街上", w:512, h:200, wall:70,
  floor(p,g,t){ p.R(0,0,512,70,"#8a7a6a"); for(let x=0;x<512;x+=4) p.R(x,0,1,70,"#7e6e5e");
    for(let i=0;i<6;i++){ const x=24+i*80; if(i===1) continue; p.R(x,12,36,26,"#1a1410"); p.R(x+2,14,32,22,"#34465e"); p.R(x+17,14,2,22,"#1a1410"); p.R(x+3,15,6,1,"#5a7088"); p.R(x-2,38,40,3,"#5a4a3a"); }
    p.R(126,18,48,52,"#1a1410"); p.R(128,20,44,50,"#2a2420"); p.R(130,22,40,46,"#6a5a48"); p.R(149,22,2,46,"#2a2420"); p.R(132,24,16,20,"#8aa0b0"); p.R(152,24,16,20,"#8aa0b0");
    p.R(120,6,60,10,"#1a1410"); p.R(122,8,56,6,"#c94a3a");
    paving(p,0,70,512,32); p.R(0,102,512,3,"#6a665e"); p.R(0,102,512,1,"#1a1410");
    p.R(0,105,512,66,"#3a3c40"); for(let x=0;x<512;x+=3) for(let y=106;y<170;y+=5) if(((x*13+y*7)%17)===0) p.R(x,y,1,1,"#45474c");
    for(let x=0;x<512;x+=32) p.R(x,137,18,2,"#e8dca0");
    for(let y=107;y<169;y+=0){ p.R(330,y,40,5,"#e8e4dc"); y+=9; }
    p.R(0,171,512,3,"#6a665e"); paving(p,0,174,512,26); },
  props:[
    ...[60,300,460].map(x=>({ y:102, draw(p){ p.R(x-2,40,5,62,"#1a1410"); p.R(x-1,41,3,61,"#4a4e56"); p.R(x-8,36,16,6,"#1a1410"); p.R(x-7,37,14,4,"#4a4e56"); p.R(x-5,41,10,2,"#ffe9a0"); } })),
    { y:130, draw(p,g,t){ SP.car(g,232,130,{ col:"#e9e4da", patrol:true, f:Math.floor(t*4)%4 }); } },
    { y:162, draw(p,g,t){ const x=((t*70)%760)-120; SP.car(g,x,162,{ col:"#a83a32", f:Math.floor(t*12)%4 }); } },
    { y:188, draw(p,g,t){ const x=520-((t*22)%600); SP.draw(g,x,188,{ skin:"#e8c09a", hair:"#5a3a22", coat:"#6a7a4a", bottom:"#3a3a44", shoes:"#2a2320" },{ view:"side", facing:-1, act:"walk", f:Math.floor(t*22/3.2)%8 }); } }
  ],
  solid:[[198,118,70,14],[56,98,8,4],[296,98,8,4],[456,98,8,4]],
  exits:[ { r:[136,70,28,8], to:"hall", at:[24,140], label:"大廈", kind:"door", art:[128,20,44,50] } ] };
const def = { top:{ start:"study", spawn:[29,80], rooms:{ study, hall, up, street } }, areas:[{id:"study",name:"書房"},{id:"hall",name:"走廊"},{id:"up",name:"地下室"},{id:"street",name:"街上"}] };
const DET = { skin:"#ecc29c", hair:"#2a1d16", coat:"#9a7a52", top:"#e9e4da", bottom:"#2e3340", shoes:"#1c1a18", hat:"#4a3424" };
const WU = { skin:"#e8c09a", hair:"#2a2a2a", coat:"#f4f6f6", top:"#8ab4d8", bottom:"#3a4152", shoes:"#2a2320" };
const MAID = { skin:"#f0c8a0", hair:"#5a3a22", coat:"#4a4a6a", top:"#4a4a6a", bottom:"#2a2a3a", shoes:"#1a1a1a" };
const seen = new Set(); const log = m => { document.getElementById("log").textContent = m; window._log = (window._log||[]).concat(m); };
let say = null;
const hooks = { you:DET, buddy:()=>({ id:"_wu", L:WU }), people:()=>[{ id:"maid", x:40, y:150, room:"study", facing:1, L:MAID, arrow:"#ffd04a" }],
  spots:()=>[{ k:"item", ids:["mug"], r:[118,80,11,9], fresh:!seen.has("mug"), room:"study" }, { k:"detail", id:"bin", r:[150,90,14,14], fresh:!seen.has("bin"), room:"study" }],
  onSpot:q=>{ seen.add(q.ids?q.ids[0]:q.id); log("spot "+(q.ids?q.ids[0]:q.id)); say={who:"you",text:"杯裡還有半杯咖啡。"}; setTimeout(()=>say=null,1500); },
  onPerson:id=>log("person "+id), onBuddy:id=>log("buddy"), onGround:()=>{}, bubble:()=>say, nameOf:id=>id, opt:()=>({}),
  script:null, scriptDone:()=>true, refresh:()=>{}, areaNow:a=>log("area "+a), nearNow:l=>{ window._near=l.map(TOPW.spotKey); } };
TOPW.mount(document.getElementById("worldcv"), def, "demo", hooks);
</script>
