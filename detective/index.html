<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="偵探檔案">
<meta name="theme-color" content="#14110f">
<title>偵探檔案</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#14110f; --panel:#1f1a17; --panel2:#2a231f; --line:#3a312b;
  --text:#efe6da; --muted:#a8998a; --accent:#d9a441; --red:#d4574a; --green:#6fb57d; --blue:#6aa6d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(20,17,15,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0;font-weight:700;letter-spacing:1px}
.clock{flex:none;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.clock .t{font-weight:700;color:var(--accent)}
.clock .bar{width:60px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.clock .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.clock.low .t{color:var(--red)} .clock.low .bar i{background:var(--red)}
main{max-width:720px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(20,17,15,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-right:6px}
.tag.cost{color:var(--accent)}
.tag.new{color:var(--blue)}
.btn{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);color:#1a140c;border-color:var(--accent);text-align:center;font-weight:700}
.btn.danger{border-color:var(--red);color:var(--red);text-align:center}
.btn.done{opacity:.55}
.btn[disabled]{opacity:.35}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sus{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.sus .av{font-size:40px;line-height:1.2}
.sus .nm{font-weight:700;margin-top:4px}
.sus .rl{font-size:13px;color:var(--muted)}
.sus .ct{font-size:12px;color:var(--accent);margin-top:4px}
.back{background:none;border:0;color:var(--accent);font-size:15px;padding:0;margin-bottom:10px;font-family:inherit}
.qa{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0}
.qa .q{font-weight:700}
.qa .a{margin-top:4px}
.qa .a.say::before{content:"「"} .qa .a.say::after{content:"」"}
.note{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
.log-sec{margin-bottom:18px}
.log-sec h3{color:var(--accent);font-size:15px;margin:0 0 4px}
.pick{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.pick.on{border-color:var(--accent);background:#3a2e1c}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.pick.on .box{border-color:var(--accent);background:var(--accent);color:#1a140c}
.grade{font-size:64px;font-weight:800;text-align:center;line-height:1;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#1a140c;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.cctv{background:#0b0d0b;border:1px solid #2c3a2c;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;color:#9fd49f;font-size:14px;white-space:pre-wrap}
.cctv .rec{color:var(--red)}
.intro p{margin:0 0 10px}
@media (min-width:700px){.suspects{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1 id="caseTitle">偵探檔案</h1>
  <div class="clock" id="clock"><span class="t" id="clockT"></span><span class="bar"><i id="clockBar"></i></span></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="brief"><span class="ic">📁</span>案情</button>
  <button data-tab="suspects"><span class="ic">🗣️</span>問話</button>
  <button data-tab="search"><span class="ic">🔍</span>搜證</button>
  <button data-tab="notes"><span class="ic">📓</span>筆記</button>
  <button data-tab="accuse"><span class="ic">⚖️</span>指認</button>
</nav>
<div class="toast" id="toast"></div>

<script>

          a:"嗰啲係誤會嚟！我……我本來打算還嘅！" },
        { id:"c8", q:"（出示打印紀錄）遺書係 23:05 打印，正正係你喺書房嗰陣，係咪你打嘅？", requires:"ev_printer",
          a:"……", note:"周曉晴低頭，眼淚流落嚟，冇再出聲。" }

  ],
  cctv: [
    { id:"cctv_kitchen", title:"廚房走廊 21:55–22:10", text:"21:56  陳浩由廚房行出嚟，手拎住冰桶，行向書房方向。\n22:03  陳浩空手行返嚟，望咗兩下鏡頭，返上樓。", clue:"陳浩 21:56 親自拎冰桶入書房" },

/* =========================================================
   遊戲邏輯
   ========================================================= */
const C = CASES[0];
const KEY = "detective_save_" + C.id;
let S = load() || fresh();
let tab = "brief", openSuspect = null, accusePick = { culprits:[], suicide:false, evidence:[] };

function fresh(){ return { used:0, asked:[], seen:[], log:[], done:false, result:null }; }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const left = () => C.timeLimit - S.used;
const has = id => S.seen.includes(id) || S.asked.includes(id);

function clockText(){
  const m = C.startClock[0]*60 + C.startClock[1] + S.used*10;
  return String(Math.floor(m/60)).padStart(2,"0")+":"+String(m%60).padStart(2,"0");
}
function renderClock(){
  document.getElementById("clockT").textContent = clockText() + " · 剩" + left() + "次";
  document.getElementById("clockBar").style.width = (left()/C.timeLimit*100)+"%";
  document.getElementById("clock").classList.toggle("low", left() <= 3);
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2200);
}
function spend(){
  S.used++; save(); renderClock();
  if (left() === 0) toast("⏰ 律師到咗！冇時間再查，要作出指認。");
  else if (left() <= 3) toast("⚠️ 只剩 " + left() + " 次行動");
}

function ask(sus, q){
  if (S.asked.includes(q.id) || left() <= 0 || S.done) return;
  S.asked.push(q.id);
  S.log.push({ type:"q", sus:sus.id, id:q.id });
  spend(); render();
}
function inspect(item, kind){
  if (S.seen.includes(item.id) || left() <= 0 || S.done) return;
  S.seen.push(item.id);
  S.log.push({ type:kind, id:item.id });
  const unlocked = C.suspects.flatMap(s=>s.questions).filter(q=>q.requires===item.id);
  spend(); render();
  if (unlocked.length && left()>0) setTimeout(()=>toast("🔓 解鎖咗新問題，可以拎去質問疑犯"), 400);
}

const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");

function vBrief(){
  return `<div class="card intro"><h2>${C.title}</h2>${C.intro.map(p=>`<p>${p}</p>`).join("")}</div>
  <div class="card"><h3>🎯 任務</h3><p style="margin:0">${C.goal}</p></div>
  <div class="card"><h3>玩法</h3><p class="small muted" style="margin:0">
  🗣️ 問話：每個疑犯有好多條問題，但時間唔夠問晒。有人會講大話。<br>
  🔍 搜證：睇 CCTV、檢查證物。搵到關鍵證據會解鎖新嘅質問問題。<br>
  📓 筆記：自動記低你問過同睇過嘅嘢。<br>
  ⚖️ 指認：揀兇手（可以多過一個）或者判斷係自殺，再揀證據證明。</p></div>
  <button class="btn primary" onclick="go('suspects')">開始調查</button>
  <button class="btn danger" onclick="restart()">重新開始呢單案</button>`;
}

function vSuspects(){
  if (openSuspect){
    const s = C.suspects.find(x=>x.id===openSuspect);
    const qs = s.questions.filter(q=>!q.requires || has(q.requires));
    const lockedN = s.questions.length - qs.length;
    const askedHere = qs.filter(q=>S.asked.includes(q.id));
    const notAsked = qs.filter(q=>!S.asked.includes(q.id));
    return `<button class="back" onclick="openSuspect=null;render()">‹ 返回疑犯列表</button>
    <div class="card"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:44px">${s.av}</div>
      <div><h2 style="margin:0">${s.name}</h2><div class="muted small">${s.role}</div></div></div></div>
    ${askedHere.length?`<div class="card"><h3>已問</h3>${askedHere.map(q=>qaHTML(q)).join("")}</div>`:""}
    <div class="card"><h3>可以問</h3>
      ${notAsked.length?notAsked.map(q=>`<button class="btn" ${left()<=0||S.done?"disabled":""} onclick="askById('${s.id}','${q.id}')">
        ${q.requires?'<span class="tag new">新</span>':''}${esc(q.q)} <span class="tag cost">10 分鐘</span></button>`).join("")
      :`<p class="muted small">暫時冇其他問題。</p>`}
      ${lockedN?`<p class="muted small">🔒 仲有 ${lockedN} 條問題，要搵到相關證據先問得。</p>`:""}
    </div>`;
  }
  return `<p class="muted small">揀一個疑犯問話。每條問題用 10 分鐘。</p>
  <div class="suspects">${C.suspects.map(s=>{
    const avail = s.questions.filter(q=>!q.requires||has(q.requires));
    const n = avail.filter(q=>S.asked.includes(q.id)).length;
    return `<div class="sus" onclick="openSuspect='${s.id}';render();scrollTo(0,0)">
      <div class="av">${s.av}</div><div class="nm">${s.name}</div><div class="rl">${s.role}</div>
      <div class="ct">已問 ${n} / 可問 ${avail.length}</div></div>`;}).join("")}</div>`;
}
function qaHTML(q){
  const silent = q.a === "……";
  return `<div class="qa"><div class="q">問：${esc(q.q)}</div><div class="a ${silent?"":"say"}">${esc(q.a)}</div>${q.note?`<div class="note">${esc(q.note)}</div>`:""}</div>`;
}
function askById(sid, qid){ const s=C.suspects.find(x=>x.id===sid); ask(s, s.questions.find(q=>q.id===qid)); }

function vSearch(){
  const block = (title, items, kind) => `<div class="card"><h3>${title}</h3>${items.map(it=>{
    if (S.seen.includes(it.id)) return `<div style="margin:12px 0"><div style="font-weight:700">${esc(it.title)}</div>
      ${kind==="cctv"?`<div class="cctv"><span class="rec">● REC</span>\n${esc(it.text)}</div>`:`<div class="muted">${nl(it.text)}</div>`}</div>`;
    return `<button class="btn" ${left()<=0||S.done?"disabled":""} onclick="inspectById('${kind}','${it.id}')">${kind==="cctv"?"📹":"🧾"} ${esc(it.title)} <span class="tag cost">10 分鐘</span></button>`;
  }).join("")}</div>`;
  return `<p class="muted small">每睇一段片或者檢查一件證物用 10 分鐘。</p>
  ${block("📹 閉路電視", C.cctv, "cctv")}${block("🧾 證物", C.evidence, "ev")}`;
}
function inspectById(kind, id){ inspect((kind==="cctv"?C.cctv:C.evidence).find(x=>x.id===id), kind); }

function vNotes(){
  if (!S.log.length) return `<div class="card"><p class="muted" style="margin:0">未有紀錄。去問話或者搜證啦。</p></div>`;
  const clues = [];
  C.suspects.forEach(s=>s.questions.forEach(q=>{ if(q.clue && S.asked.includes(q.id)) clues.push(q.clue); }));
  [...C.cctv, ...C.evidence].forEach(it=>{ if(it.clue && S.seen.includes(it.id)) clues.push(it.clue); });
  let html = `<div class="card"><h3>🔑 重點</h3><ul style="margin:0;padding-left:20px">${clues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`;
  C.suspects.forEach(s=>{
    const qs = s.questions.filter(q=>S.asked.includes(q.id));
    if (qs.length) html += `<div class="card log-sec"><h3>${s.av} ${s.name}</h3>${qs.map(qaHTML).join("")}</div>`;
  });
  return html + `<p class="muted small">提示：對比口供同 CCTV、時間，搵出邊個講大話，再諗佢點解要講大話。</p>`;
}

function vAccuse(){
  if (S.done) return vResult();
  const seenItems = [...C.cctv, ...C.evidence].filter(it=>S.seen.includes(it.id));
  const P = accusePick;
  return `<div class="card"><h2>⚖️ 作出指認</h2><p class="muted small" style="margin:0">指認之後就唔可以再調查。${left()>0?`你仲有 ${left()} 次行動未用。`:""}</p></div>
  <div class="card"><h3>1. 陳生係點死？</h3>
    <div class="pick ${P.suicide?"on":""}" onclick="pickSuicide(true)"><span class="box">${P.suicide?"✓":""}</span>自殺</div>
    <div class="pick ${!P.suicide&&P.culprits.length?"on":""}" onclick="pickSuicide(false)"><span class="box">${!P.suicide&&P.culprits.length?"✓":""}</span>被人殺害</div>
  </div>
  ${P.suicide?"":`<div class="card"><h3>2. 兇手係邊個？（可以揀多過一個）</h3>
    ${C.suspects.map(s=>`<div class="pick ${P.culprits.includes(s.id)?"on":""}" onclick="toggleCulprit('${s.id}')"><span class="box">${P.culprits.includes(s.id)?"✓":""}</span>${s.av} ${s.name}</div>`).join("")}
  </div>`}
  <div class="card"><h3>${P.suicide?"2":"3"}. 揀最多 3 件關鍵證據</h3>
    ${seenItems.length?seenItems.map(it=>`<div class="pick ${P.evidence.includes(it.id)?"on":""}" onclick="toggleEv('${it.id}')"><span class="box">${P.evidence.includes(it.id)?"✓":""}</span>${esc(it.title)}</div>`).join("")
    :`<p class="muted small">你未睇過任何 CCTV 或證物。</p>`}
  </div>
  <button class="btn primary" onclick="submitAccuse()">確定指認</button>`;
}
function pickSuicide(v){ accusePick.suicide=v; if(v) accusePick.culprits=[]; else if(!accusePick.culprits.length) toast("揀埋兇手"); render(); }
function toggleCulprit(id){ const c=accusePick.culprits; accusePick.suicide=false; c.includes(id)?c.splice(c.indexOf(id),1):c.push(id); render(); }
function toggleEv(id){ const e=accusePick.evidence; if(e.includes(id)) e.splice(e.indexOf(id),1); else if(e.length<3) e.push(id); else toast("最多揀 3 件"); render(); }
function submitAccuse(){
  const P = accusePick;
  if (!P.suicide && !P.culprits.length){ toast("請揀「自殺」或者至少一個兇手"); return; }
  if (!confirm("確定指認？之後就唔可以再調查。")) return;
  const sol = C.solution;
  let verdict;
  if (P.suicide) verdict = sol.suicide ? "perfect" : "wrong";
  else {
    const right = P.culprits.filter(x=>sol.culprits.includes(x)).length;
    const wrongN = P.culprits.length - right;
    verdict = (right===sol.culprits.length && !wrongN) ? "perfect" : right>0 ? "partial" : "wrong";
  }
  const evHits = P.evidence.filter(e=>sol.keyEvidence.includes(e)).length;
  let grade;
  if (verdict==="perfect") grade = evHits>=3 ? "S" : evHits===2 ? "A" : "B";
  else if (verdict==="partial") grade = evHits>=2 ? "C" : "D";
  else grade = "F";
  S.done = true; S.result = { verdict, evHits, grade, pick: JSON.parse(JSON.stringify(P)), used:S.used };
  save(); render(); scrollTo(0,0);
}
function vResult(){
  const r = S.result, sol = C.solution;
  const msg = { perfect:"完全正確！你揭穿咗所有兇手。", partial:"捉到部分真相，但有兇手甩咗身，或者你冤枉咗人。", wrong:"推理錯誤，真兇逍遙法外。" }[r.verdict];
  const pickName = r.pick.suicide ? "自殺" : r.pick.culprits.map(id=>C.suspects.find(s=>s.id===id).name).join("、");
  return `<div class="card" style="text-align:center"><div class="muted small">評級</div>
    <div class="grade" style="color:${r.grade==="F"?"var(--red)":r.grade==="S"?"var(--accent)":"var(--text)"}">${r.grade}</div>
    <p style="margin:4px 0">${msg}</p>
    <p class="muted small" style="margin:0">你嘅指認：${pickName}　｜　關鍵證據命中 ${r.evHits}/3　｜　用咗 ${r.used} 次行動</p></div>
  <div class="card"><h3>📜 真相</h3>${sol.truth.map(p=>`<p>${p}</p>`).join("")}</div>
  <button class="btn primary" onclick="restart(true)">再玩一次</button>`;
}

function restart(skipConfirm){
  if (!skipConfirm && !confirm("清除所有進度，重新開始？")) return;
  S = fresh(); accusePick = { culprits:[], suicide:false, evidence:[] }; openSuspect=null; save(); go("brief");
}
function go(t){ tab=t; if(t!=="suspects") openSuspect=null; render(); scrollTo(0,0); }
function render(){
  document.getElementById("caseTitle").textContent = "🕵️ " + C.title;
  renderClock();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const v = { brief:vBrief, suspects:vSuspects, search:vSearch, notes:vNotes, accuse:vAccuse }[tab]();
  document.getElementById("view").innerHTML = v;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
