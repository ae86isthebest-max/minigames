<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="偵探檔案">
<meta name="theme-color" content="#14110f">
<title>偵探檔案</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#14110f; --panel:#1f1a17; --panel2:#2a231f; --line:#3a312b;
  --text:#efe6da; --muted:#a8998a; --accent:#d9a441; --red:#d4574a; --green:#6fb57d; --blue:#6aa6d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(20,17,15,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0;font-weight:700;letter-spacing:1px}
.clock{flex:none;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.clock .t{font-weight:700;color:var(--accent)}
.clock .bar{width:60px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.clock .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.clock.low .t{color:var(--red)} .clock.low .bar i{background:var(--red)}
main{max-width:720px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(20,17,15,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-right:6px}
.tag.cost{color:var(--accent)}
.tag.new{color:var(--blue)}
.btn{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);color:#1a140c;border-color:var(--accent);text-align:center;font-weight:700}
.btn.danger{border-color:var(--red);color:var(--red);text-align:center}
.btn.done{opacity:.55}
.btn[disabled]{opacity:.35}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sus{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.sus .av{font-size:40px;line-height:1.2}
.sus .nm{font-weight:700;margin-top:4px}
.sus .rl{font-size:13px;color:var(--muted)}
.sus .ct{font-size:12px;color:var(--accent);margin-top:4px}
.back{background:none;border:0;color:var(--accent);font-size:15px;padding:0;margin-bottom:10px;font-family:inherit}
.qa{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0}
.qa .q{font-weight:700}
.qa .a{margin-top:4px}
.qa .a.say::before{content:"「"} .qa .a.say::after{content:"」"}
.note{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
.log-sec{margin-bottom:18px}
.log-sec h3{color:var(--accent);font-size:15px;margin:0 0 4px}
.pick{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.pick.on{border-color:var(--accent);background:#3a2e1c}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.pick.on .box{border-color:var(--accent);background:var(--accent);color:#1a140c}
.grade{font-size:64px;font-weight:800;text-align:center;line-height:1;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#1a140c;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.cctv{background:#0b0d0b;border:1px solid #2c3a2c;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;color:#9fd49f;font-size:14px;white-space:pre-wrap}
.cctv .rec{color:var(--red)}
.intro p{margin:0 0 10px}
@media (min-width:700px){.suspects{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <h1 id="caseTitle">偵探檔案</h1>
  <div class="clock" id="clock"><span class="t" id="clockT"></span><span class="bar"><i id="clockBar"></i></span></div>
</header>
<main id="view"></main>
<nav id="nav">
  <button data-tab="brief"><span class="ic">📁</span>案情</button>
  <button data-tab="suspects"><span class="ic">🗣️</span>問話</button>
  <button data-tab="search"><span class="ic">🔍</span>搜證</button>
  <button data-tab="notes"><span class="ic">📓</span>筆記</button>
  <button data-tab="accuse"><span class="ic">⚖️</span>推理</button>
</nav>
<div class="toast" id="toast"></div>

<script src="cases.js"></script>
<script>
/* =========================================================
   遊戲邏輯
   ========================================================= */
const C = CASES[0];
const KEY = "detective_tw3_save_" + C.id;
let S = load() || fresh();
let tab = "brief", openSuspect = null, accusePick = freshPick();

function fresh(){ return { asked:[], seen:[], done:false, result:null }; }
function freshPick(){ return { kind:null, culprits:[], evidence:[], reasoning:{} }; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.asked ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const has = id => S.seen.includes(id) || S.asked.includes(id);
const askedOf = s => s.questions.filter(q=>S.asked.includes(q.id)).length;
const qLeft = s => C.questionLimit - askedOf(s);
const searchLeft = () => C.searchLimit - S.seen.length;
const totalQLeft = () => C.suspects.reduce((n,s)=>n+qLeft(s),0);

function renderClock(){
  document.getElementById("clockT").textContent = "🗣️" + totalQLeft() + "　🔍" + searchLeft();
  const total = C.suspects.length*C.questionLimit + C.searchLimit;
  const left = totalQLeft() + searchLeft();
  document.getElementById("clockBar").style.width = (Math.max(0,left)/total*100)+"%";
  document.getElementById("clock").classList.toggle("low", left <= 4);
}
function toast(msg){
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove("show"), 2400);
}
function afterSpend(){
  save(); renderClock();
  if (totalQLeft()===0 && searchLeft()===0) setTimeout(()=>toast("⏰ 律師到了！調查結束，請進行指認。"), 300);
}

function ask(sus, q){
  if (S.asked.includes(q.id) || qLeft(sus) <= 0 || S.done) return;
  const before = availCount();
  (S.variant = S.variant || {})[q.id] = q.alt && q.alt.when.some(has) ? "alt" : "base";
  S.asked.push(q.id); afterSpend(); render();
  if (availCount() > before) setTimeout(()=>toast("🔓 聽到新線索，可以拿去問其他人"), 400);
  if (qLeft(sus)===0) setTimeout(()=>toast(sus.name + "：「我不會再回答了，等我的律師來。」"), 300);
}
function inspect(item){
  if (S.seen.includes(item.id) || searchLeft() <= 0 || S.done) return;
  const before = availCount();
  S.seen.push(item.id); afterSpend(); render();
  if (availCount() > before) setTimeout(()=>toast("🔓 解鎖新問題，可以拿去質問嫌疑人"), 400);
}

const esc = s => String(s).replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const nl = s => esc(s).replace(/\n/g,"<br>");

function vBrief(){
  return `<div class="card intro"><h2>${C.title}</h2>${C.intro.map(p=>`<p>${p}</p>`).join("")}</div>
  <div class="card"><h3>🎯 任務</h3><p style="margin:0">${C.goal}</p></div>
  <div class="card"><h3>玩法</h3><p class="small muted" style="margin:0">
  🗣️ 問話：每位嫌疑人有很多問題可以問，但只會回答你 ${C.questionLimit} 題。有人會說謊。<br>
  🔍 搜證：調閱監視器、檢查證物，總共只能查 ${C.searchLimit} 項。找到關鍵證據會解鎖新的質問問題（質問也算一題）。<br>
  💡 有些問題要先從別人口中聽到相關的事才問得出來，所以先問誰、後問誰很重要。<br>
  📓 筆記：自動記錄你問過、看過的內容。<br>
  ⚖️ 推理：隨時都可以推理。判斷發生了什麼事、選出兇手（可以不只一個），再選證據並回答推理題。查到越多線索，能選的可能性和推理題就越多。推理錯了不會公布真相，可以繼續調查再試。</p></div>
  <button class="btn primary" onclick="go('suspects')">開始調查</button>
  <button class="btn" style="text-align:center" onclick="go('accuse')">🧠 我已經知道真相了！直接推理</button>
  <button class="btn danger" onclick="restart()">重新開始這個案件</button>`;
}

function vSuspects(){
  if (openSuspect){
    const s = C.suspects.find(x=>x.id===openSuspect);
    const qs = s.questions.filter(unlocked);
    const lockedN = s.questions.length - qs.length;
    const askedHere = qs.filter(q=>S.asked.includes(q.id));
    const notAsked = qs.filter(q=>!S.asked.includes(q.id));
    const left = qLeft(s), off = left<=0||S.done;
    return `<button class="back" onclick="openSuspect=null;render()">‹ 返回嫌疑人列表</button>
    <div class="card"><div style="display:flex;gap:12px;align-items:center"><div style="font-size:44px">${s.av}</div>
      <div><h2 style="margin:0">${s.name}</h2><div class="muted small">${s.role}</div>
      <div class="small" style="color:${left?"var(--accent)":"var(--red)"}">${left?`還願意回答 ${left} 題`:"拒絕再回答"}</div></div></div></div>
    ${askedHere.length?`<div class="card"><h3>已問</h3>${askedHere.map(q=>qaHTML(q)).join("")}</div>`:""}
    ${off?"":`<div class="card"><h3>可以問（選 ${left} 題）</h3>
      ${notAsked.length?notAsked.map(q=>`<button class="btn" onclick="askById('${s.id}','${q.id}')">
        ${/^（出示/.test(q.q)?'<span class="tag new">質問</span>':(q.requires||q.requiresAll)?'<span class="tag new">追問</span>':''}${esc(textOf(q).q)}</button>`).join("")
      :`<p class="muted small">暫時沒有其他問題。</p>`}
      ${lockedN?`<p class="muted small">🔒 還有 ${lockedN} 個問題，要先從其他人口中或證物裡得到相關線索才能問。</p>`:""}
    </div>`}`;
  }
  return `<p class="muted small">選一位嫌疑人問話。每人只會回答 ${C.questionLimit} 題，先想清楚要問什麼。</p>
  <div class="suspects">${C.suspects.map(s=>{
    const left = qLeft(s);
    return `<div class="sus" onclick="openSuspect='${s.id}';render();scrollTo(0,0)">
      <div class="av">${s.av}</div><div class="nm">${s.name}</div><div class="rl">${s.role}</div>
      <div class="ct" style="${left?"":"color:var(--red)"}">${left?`還能問 ${left} 題`:"已拒答"}</div></div>`;}).join("")}</div>`;
}
function qaHTML(q){
  const t = textOf(q), silent = t.a === "……";
  return `<div class="qa"><div class="q">問：${esc(t.q)}</div><div class="a ${silent?"":"say"}">${esc(t.a)}</div>${q.note?`<div class="note">${esc(q.note)}</div>`:""}</div>`;
}
function askById(sid, qid){ const s=C.suspects.find(x=>x.id===sid); ask(s, s.questions.find(q=>q.id===qid)); }

function vSearch(){
  const off = searchLeft()<=0||S.done;
  const block = (title, items, kind) => `<div class="card"><h3>${title}</h3>${items.map(it=>{
    if (S.seen.includes(it.id)) return `<div style="margin:12px 0"><div style="font-weight:700">${esc(it.title)}</div>
      ${kind==="cctv"?`<div class="cctv"><span class="rec">● REC</span>\n${esc(it.text)}</div>`:`<div class="muted">${nl(it.text)}</div>`}</div>`;
    return `<button class="btn" ${off?"disabled":""} onclick="inspectById('${kind}','${it.id}')">${kind==="cctv"?"📹":"🧾"} ${esc(it.title)}</button>`;
  }).join("")}</div>`;
  return `<p class="muted small">${searchLeft()>0?`鑑識人員還能幫你處理 <b style="color:var(--accent)">${searchLeft()}</b> 項（共 ${C.cctv.length+C.evidence.length} 項）。`:"鑑識人員已經沒時間了。"}</p>
  ${block("📹 監視器", C.cctv, "cctv")}${block("🧾 證物", C.evidence, "ev")}`;
}
function inspectById(kind, id){ inspect((kind==="cctv"?C.cctv:C.evidence).find(x=>x.id===id)); }

function vNotes(){
  if (!S.asked.length && !S.seen.length) return `<div class="card"><p class="muted" style="margin:0">還沒有紀錄。先去問話或搜證吧。</p></div>`;
  const clues = [];
  C.suspects.forEach(s=>s.questions.forEach(q=>{ if(q.clue && S.asked.includes(q.id)) clues.push(q.clue); }));
  [...C.cctv, ...C.evidence].forEach(it=>{ if(it.clue && S.seen.includes(it.id)) clues.push(it.clue); });
  let html = clues.length?`<div class="card"><h3>🔑 重點</h3><ul style="margin:0;padding-left:20px">${clues.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></div>`:"";
  C.suspects.forEach(s=>{
    const qs = s.questions.filter(q=>S.asked.includes(q.id));
    if (qs.length) html += `<div class="card log-sec"><h3>${s.av} ${s.name}</h3>${qs.map(qaHTML).join("")}</div>`;
  });
  const seen = [...C.cctv, ...C.evidence].filter(it=>S.seen.includes(it.id));
  if (seen.length) html += `<div class="card log-sec"><h3>🔍 搜證結果</h3>${seen.map(it=>`<div style="margin:10px 0"><b>${esc(it.title)}</b><div class="muted small">${nl(it.text)}</div></div>`).join("")}</div>`;
  return html + `<p class="muted small">提示：比對口供、監視器和時間，找出誰在說謊，再想想他為什麼要說謊。</p>`;
}

function unlocked(item){
  const any = item.requires ? [].concat(item.requires) : null;
  return (!any || any.some(has)) && (!item.requiresAll || item.requiresAll.every(has));
}
const availCount = () => C.suspects.flatMap(s=>s.questions).filter(unlocked).length;
// 問題的問法與回答：問的當下決定用哪個版本，之後筆記裡不會變
function textOf(q){
  const v = S.variant && S.variant[q.id];
  const useAlt = v ? v==="alt" : !!(q.alt && q.alt.when.some(has));
  return { q: useAlt && q.alt.q || q.q, a: useAlt && q.alt.a || q.a };
}
const allPeople = () => [...C.suspects, ...C.extraPeople.filter(unlocked)];
const kindOf = id => C.kinds.find(k=>k.id===id);

function vAccuse(){
  if (S.done) return vResult();
  const seenItems = [...C.cctv, ...C.evidence].filter(it=>S.seen.includes(it.id));
  const P = accusePick;
  const kinds = C.kinds.filter(unlocked);
  const lockedKinds = C.kinds.length - kinds.length;
  const people = allPeople();
  const murder = P.kind==="murder";
  const lockedR = C.reasoning.filter(r=>!unlocked(r)).length;
  let n = 1;
  return `<div class="card"><h2>⚖️ 推理真相</h2><p class="muted small" style="margin:0">隨時都可以來這裡推理。推理錯了不會直接公布真相，可以回去繼續調查再推理一次。${totalQLeft()+searchLeft()>0?`你還有 ${totalQLeft()} 題可問、${searchLeft()} 項可查。`:""}<br>你查到越多線索，能選的可能性就越多。</p></div>
  <div class="card"><h3>${n++}. 到底發生了什麼事？</h3>
    ${kinds.map(k=>`<div class="pick ${P.kind===k.id?"on":""}" onclick="pickKind('${k.id}')"><span class="box">${P.kind===k.id?"✓":""}</span>${esc(k.label)}</div>`).join("")}
    ${lockedKinds?`<p class="muted small">🔒 還有 ${lockedKinds} 種可能性，要先發現相關線索才會出現。</p>`:""}
  </div>
  ${murder?`<div class="card"><h3>${n++}. 兇手是誰？（可以複選，甚至全部都選）</h3>
    ${people.map(s=>`<div class="pick ${P.culprits.includes(s.id)?"on":""}" onclick="toggleCulprit('${s.id}')"><span class="box">${P.culprits.includes(s.id)?"✓":""}</span>${s.av} ${esc(s.name)}</div>`).join("")}
    ${people.length>C.suspects.length?"":`<p class="muted small">🔒 調查中出現的其他人物，也會加進這裡。</p>`}
  </div>
  ${C.reasoning.map((r,i)=>!unlocked(r)?"":`<div class="card"><h3>${n++}. ${esc(r.q)}</h3>
    ${r.options.map((o,j)=>`<div class="pick ${P.reasoning[i]===j?"on":""}" onclick="pickReason(${i},${j})"><span class="box">${P.reasoning[i]===j?"✓":""}</span>${esc(o)}</div>`).join("")}</div>`).join("")}
  ${lockedR?`<div class="card"><p class="muted small" style="margin:0">🔒 還有 ${lockedR} 題推理題，要先發現相關線索才會出現。沒出現的題目不會得分。</p></div>`:""}`:""}
  ${P.kind===null?"":`<div class="card"><h3>${n++}. 選最多 3 項關鍵證據</h3>
    ${seenItems.length?seenItems.map(it=>`<div class="pick ${P.evidence.includes(it.id)?"on":""}" onclick="toggleEv('${it.id}')"><span class="box">${P.evidence.includes(it.id)?"✓":""}</span>${esc(it.title)}</div>`).join("")
    :`<p class="muted small">你還沒看過任何監視器或證物，只能憑直覺了。</p>`}
  </div>
  <button class="btn primary" onclick="submitAccuse()">確定提交</button>`}`;
}
function pickKind(v){ accusePick.kind=v; if(v!=="murder") accusePick.culprits=[]; render(); }
function toggleCulprit(id){ const c=accusePick.culprits; c.includes(id)?c.splice(c.indexOf(id),1):c.push(id); render(); }
function pickReason(i,j){ accusePick.reasoning[i]=j; render(); }
function toggleEv(id){ const e=accusePick.evidence; if(e.includes(id)) e.splice(e.indexOf(id),1); else if(e.length<3) e.push(id); else toast("最多選 3 項"); render(); }
function submitAccuse(){
  const P = accusePick, murder = P.kind==="murder";
  if (murder && !P.culprits.length){ toast("請至少選一名兇手"); return; }
  if (murder && C.reasoning.some((r,i)=>unlocked(r) && P.reasoning[i]===undefined)){ toast("推理題還沒答完"); return; }
  if (!confirm("確定提交你的推理？")) return;
  const sol = C.solution;
  let verdict;
  if (P.kind !== sol.kind) verdict = "wrong";
  else if (!murder) verdict = "perfect";
  else {
    const right = P.culprits.filter(x=>sol.culprits.includes(x)).length;
    const wrongN = P.culprits.length - right;
    verdict = (right===sol.culprits.length && !wrongN) ? "perfect" : right>0 ? "partial" : "wrong";
  }
  const evHits = P.evidence.filter(e=>sol.keyEvidence.includes(e)).length;
  const reasonHits = murder ? C.reasoning.filter((r,i)=>unlocked(r) && P.reasoning[i]===r.answer).length : 0;
  const pts = evHits + reasonHits;   // 0–6
  let grade;
  if (verdict==="perfect") grade = pts>=6 ? "S" : pts>=4 ? "A" : "B";
  else if (verdict==="partial") grade = pts>=3 ? "C" : "D";
  else grade = "F";
  S.done = true;
  S.tries = (S.tries||0) + 1;
  S.revealed = verdict==="perfect";
  S.result = { verdict, evHits, reasonHits, grade, pick: JSON.parse(JSON.stringify(P)), qUsed:S.asked.length, sUsed:S.seen.length };
  save(); render(); scrollTo(0,0);
}
function vResult(){
  const r = S.result, sol = C.solution, murder = r.pick.kind==="murder";
  const msg = { perfect:"完全正確！你揪出了所有兇手。", partial:"抓到部分真相，但有兇手逃過一劫，或是你冤枉了好人。", wrong:"推理錯誤，真兇逍遙法外。" }[r.verdict];
  const everyone = [...C.suspects, ...C.extraPeople];
  const pickName = murder ? "他殺：" + r.pick.culprits.map(id=>everyone.find(s=>s.id===id).name).join("、") : kindOf(r.pick.kind).label;
  const shown = S.revealed !== false;   // 舊存檔沒有這個欄位，視為已公布
  const answers = !murder || !shown ? "" : `<div class="card"><h3>🧩 推理題</h3>${C.reasoning.map((q,i)=>{
    const mine = r.pick.reasoning[i], ok = mine===q.answer;
    return `<p style="margin:6px 0">${ok?"✅":"❌"} ${esc(q.q)}<br><span class="muted small">答案：${esc(q.options[q.answer])}${ok?"":`（${mine===undefined?"你沒有作答":"你選："+esc(q.options[mine])}）`}</span></p>`;}).join("")}</div>`;
  const canDig = totalQLeft()+searchLeft() > 0;
  const tail = shown ? `${answers}
  <div class="card"><h3>📜 真相</h3>${sol.truth.map(p=>`<p>${p}</p>`).join("")}</div>
  <button class="btn primary" onclick="restart(true)">再玩一次</button>`
  : `<div class="card"><h3>🤔 真相還沒公布</h3><p class="muted small" style="margin:0">你的推理還不完全正確。${canDig?`你還有 ${totalQLeft()} 題可問、${searchLeft()} 項可查，可以回去繼續調查，`:"調查的機會已經用完，但你可以重新整理筆記，"}再推理一次。這是你第 ${S.tries||1} 次推理。</p></div>
  <button class="btn primary" onclick="retry()">${canDig?"繼續調查，再推理一次":"再推理一次"}</button>
  <button class="btn" style="text-align:center" onclick="reveal()">我放棄，直接看真相</button>
  <button class="btn danger" onclick="restart()">整個案件重新開始</button>`;
  return `<div class="card" style="text-align:center"><div class="muted small">評級</div>
    <div class="grade" style="color:${r.grade==="F"?"var(--red)":r.grade==="S"?"var(--accent)":"var(--text)"}">${r.grade}</div>
    <p style="margin:4px 0">${msg}</p>
    <p class="muted small" style="margin:0">你的推理：${esc(pickName)}<br>關鍵證據 ${r.evHits}/3${murder?`　推理題 ${r.reasonHits}/${C.reasoning.length}`:""}<br>問了 ${r.qUsed} 題、查了 ${r.sUsed} 項</p></div>
  ${tail}`;
}
function retry(){ S.done=false; S.result=null; accusePick=freshPick(); save(); go(totalQLeft()+searchLeft()>0?"notes":"accuse"); }
function reveal(){ if(!confirm("確定要看真相？看了就沒有懸念了。")) return; S.revealed=true; save(); render(); scrollTo(0,0); }

function restart(skipConfirm){
  if (!skipConfirm && !confirm("清除所有進度，重新開始？")) return;
  S = fresh(); accusePick = freshPick(); openSuspect=null; save(); go("brief");
}
function go(t){ tab=t; openSuspect=null; render(); scrollTo(0,0); }
function render(){
  document.getElementById("caseTitle").textContent = "🕵️ " + C.title;
  renderClock();
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const v = { brief:vBrief, suspects:vSuspects, search:vSearch, notes:vNotes, accuse:vAccuse }[tab]();
  document.getElementById("view").innerHTML = v;
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
render();
if ("serviceWorker" in navigator) {
  // 有新版時自動重新載入一次，玩家不必手動清快取
  const hadSW = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if (hadSW && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
}
</script>
</body>
</html>
