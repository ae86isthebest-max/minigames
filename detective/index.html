<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="偵探檔案">
<meta name="theme-color" content="#14110f">
<title>偵探檔案</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{
  --bg:#14110f; --panel:#1f1a17; --panel2:#2a231f; --line:#3a312b;
  --text:#efe6da; --muted:#a8998a; --accent:#d9a441; --red:#d4574a; --green:#6fb57d; --blue:#6aa6d9;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.6}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:5;background:rgba(20,17,15,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;margin:0;font-weight:700;letter-spacing:1px}
.clock{flex:none;font-size:14px;white-space:nowrap;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.clock .t{font-weight:700;color:var(--accent)}
.clock .bar{width:60px;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden}
.clock .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.clock.low .t{color:var(--red)} .clock.low .bar i{background:var(--red)}
main{max-width:720px;margin:0 auto;padding:16px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:rgba(20,17,15,.97);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 8px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 8px;font-size:18px}
.card h3{margin:0 0 6px;font-size:16px}
.muted{color:var(--muted)}
.small{font-size:13px}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel2);color:var(--muted);margin-right:6px}
.tag.cost{color:var(--accent)}
.tag.new{color:var(--blue)}
.btn{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;font-size:15px;font-family:inherit;cursor:pointer}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--accent);color:#1a140c;border-color:var(--accent);text-align:center;font-weight:700}
.btn.danger{border-color:var(--red);color:var(--red);text-align:center}
.btn.done{opacity:.55}
.btn[disabled]{opacity:.35}
.suspects{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sus{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;cursor:pointer}
.sus .av{font-size:40px;line-height:1.2}
.sus .nm{font-weight:700;margin-top:4px}
.sus .rl{font-size:13px;color:var(--muted)}
.sus .ct{font-size:12px;color:var(--accent);margin-top:4px}
.back{background:none;border:0;color:var(--accent);font-size:15px;padding:0;margin-bottom:10px;font-family:inherit}
.qa{border-left:3px solid var(--accent);padding:4px 0 4px 12px;margin:12px 0}
.qa .q{font-weight:700}
.qa .a{margin-top:4px}
.qa .a.say::before{content:"「"} .qa .a.say::after{content:"」"}
.note{font-size:13px;color:var(--muted);margin-top:4px;font-style:italic}
.log-sec{margin-bottom:18px}
.log-sec h3{color:var(--accent);font-size:15px;margin:0 0 4px}
.pick{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer}
.pick.on{border-color:var(--accent);background:#3a2e1c}
.pick .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--muted);flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
.pick.on .box{border-color:var(--accent);background:var(--accent);color:#1a140c}
.grade{font-size:64px;font-weight:800;text-align:center;line-height:1;margin:8px 0}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--accent);color:#1a140c;padding:8px 16px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.cctv{background:#0b0d0b;border:1px solid #2c3a2c;border-radius:10px;padding:12px;font-family:ui-monospace,Menlo,monospace;color:#9fd49f;font-size:14px;white-space:pre-wrap}
.cctv .rec{color:var(--red)}
.intro p{margin:0 0 10px}
@media (min-width:700px){.suspects{grid-template-columns:repeat(4,1fr)}}
.hbtn{background:none;border:0;color:var(--accent);font-size:15px;padding:0 6px 0 0;font-family:inherit;flex:none;cursor:pointer}
.hleft{display:flex;align-items:center;min-width:0;gap:4px}
.ep{cursor:pointer}
.ep .no{font-size:13px;color:var(--accent);letter-spacing:1px}
.ep h2{margin:2px 0 6px}
.sus.gone{opacity:.5;filter:grayscale(1)}
.phase{display:inline-block;font-size:12px;padding:2px 10px;border-radius:99px;background:#3a2e1c;color:var(--accent);margin-bottom:6px}
.report{border-left:3px solid var(--blue);padding:2px 0 2px 12px;margin:10px 0}
details.past{margin-bottom:14px}
details.past summary{cursor:pointer;color:var(--muted);font-size:14px;padding:6px 0}
.scene{position:relative;margin:0 0 12px;border-radius:12px;overflow:hidden;border:2px solid var(--line);background:#000;line-height:0}
.scene canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.talk{margin-bottom:14px}
.talk .scene{margin:0}
.talk .you{font-size:13px;color:var(--muted);margin:0 2px 6px}
.bubble{position:relative;background:#fffdf7;color:#1b1512;border:3px solid #1b1512;padding:8px 12px;margin:0 6px 12px;font-size:15px;line-height:1.55;box-shadow:4px 4px 0 #1b1512;cursor:pointer;min-height:48px}
.bubble b{display:block;font-size:12px;color:#8a5a1a;margin-bottom:2px}
.bubble::after{content:"";position:absolute;left:50%;bottom:-15px;margin-left:-9px;border:9px solid transparent;border-top-color:#1b1512;border-bottom:0}
.bubble::before{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:#fffdf7;border-bottom:0;z-index:1}
.scene canvas.tap{cursor:pointer}
.rooms{display:flex;gap:6px;overflow-x:auto;margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}
.rooms button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:999px;padding:6px 11px;font-size:13px;font-family:inherit;cursor:pointer}
.rooms button.on{background:var(--accent);color:#1a140c;border-color:var(--accent);font-weight:700}
.rooms button .dot{color:#ffd04a;margin-left:3px}
.rooms button.on .dot{color:#7a3a00}
.hint{font-size:12px;color:var(--muted);margin:-4px 2px 10px}
.look{background:#fffdf7;color:#1b1512;border:3px solid #1b1512;box-shadow:4px 4px 0 #1b1512;padding:10px 12px;margin:0 4px 14px;line-height:1.6;font-size:15px}
.look b{display:block;font-size:13px;color:#8a5a1a;margin-bottom:2px}
.look .muted{color:#5a4a3a}
.look .cctv{background:#0d1a12;color:#9fd49f}
.doing{margin:0 2px 12px;font-size:13px;color:var(--muted);line-height:1.6}
.doing span{color:var(--text);cursor:pointer;text-decoration:underline dotted}
.cap{line-height:1.5;font-size:13px;color:#9fd49f;background:#0d1a12;padding:6px 10px;min-height:20px;font-family:ui-monospace,Menlo,monospace}
.ctl{display:flex;gap:6px;background:#0d1a12;padding:0 8px 8px;line-height:1}
.ctl button{background:#1d2a22;color:#9fd49f;border:1px solid #2f4a3a;border-radius:6px;padding:5px 10px;font-size:13px;font-family:inherit;cursor:pointer}
.court-bubble{min-height:70px}
.found{font-size:12px;color:var(--accent)}
.world{position:relative;margin:0 -16px 10px;border-top:2px solid #000;border-bottom:2px solid #000;line-height:0;background:#000;overflow:hidden}
.world canvas{width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:pointer}
.wsign{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-weight:800;letter-spacing:.08em;line-height:1;pointer-events:none;text-shadow:0 1px 0 rgba(0,0,0,.55);z-index:1}
.wnav{position:absolute;transform:translate(-50%,-100%);font-size:12px;font-family:inherit;line-height:1.2;padding:3px 9px;background:rgba(20,16,12,.8);color:#ffe8a0;border:1.5px solid #ffd04a;border-radius:99px;white-space:nowrap;z-index:1;cursor:pointer;animation:wnavb 1.6s ease-in-out infinite}
.wnav.go{font-size:14px;font-weight:700;padding:6px 13px;color:#fff;background:rgba(30,60,30,.88);border:2px solid #6fd46f;box-shadow:0 2px 8px rgba(0,0,0,.55);z-index:2}
.wnav.secret{color:#e8d8ff;border-color:#b07aff;background:rgba(40,20,60,.82);letter-spacing:.1em}
@keyframes wnavb{0%,100%{margin-top:0}50%{margin-top:-3px}}
.wskip{position:absolute;right:8px;top:8px;z-index:3;background:rgba(20,16,12,.72);color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:99px;padding:4px 12px;font-size:12px;font-family:inherit;cursor:pointer}
.wbubble{position:absolute;top:6px;max-width:78%;width:max-content;background:#fffdf7;color:#1b1512;border:2px solid #1b1512;box-shadow:3px 3px 0 #1b1512;padding:5px 9px;font-size:13.5px;line-height:1.5;pointer-events:none;z-index:2}
.wbubble b{display:block;font-size:11px;color:#8a5a1a}
.wbubble::after{content:"";position:absolute;left:var(--tail,50%);bottom:-9px;margin-left:-6px;border:6px solid transparent;border-top-color:#1b1512;border-bottom:0}
.wbtns{position:absolute;left:8px;top:8px;z-index:3;display:flex;gap:6px;flex-wrap:wrap;align-items:flex-end;max-width:75%;pointer-events:none}
.wbtns button{pointer-events:auto}
.wgo{background:rgba(20,16,12,.82);color:#fff;border:1.5px solid #6fd46f;border-radius:99px;padding:6px 12px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.wgo[hidden]{display:none}
.wroom{background:rgba(20,16,12,.82);color:#fff;border:1.5px solid #ffd04a;border-radius:99px;padding:6px 12px;font-size:13px;font-family:inherit;font-weight:700;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.5);display:flex;align-items:center;gap:2px}
.wroom[hidden]{display:none}
.wroom .an{font-weight:400;opacity:.85}
.wroom .n{background:#ffd04a;color:#2a1f10;border-radius:99px;min-width:18px;padding:0 5px;margin-left:4px;font-size:12px;text-align:center}
.wroom .n.ok{background:#6fd46f}
.wroom .n.pp{background:#e9e4da}
.wtip{position:absolute;right:8px;bottom:6px;font-size:11px;color:#fff;line-height:1.2;text-shadow:0 1px 2px #000;pointer-events:none}
.wtop{display:flex;gap:12px;align-items:center;margin-bottom:8px;font-size:13px;color:var(--muted)}
.wtop .back{margin:0}
.wtop b{color:var(--text);font-size:15px}
.wmap .mlab{position:absolute;transform:translate(-50%,6px);white-space:nowrap;line-height:1.25;font-size:10.5px;font-family:inherit;color:#1b1512;background:#fffdf7;border:2px solid #1b1512;box-shadow:2px 2px 0 #1b1512;padding:1px 5px;cursor:pointer;z-index:2}
.wmap .mlab i{display:block;font-style:normal;font-size:9.5px;color:#8a5a1a}
.wmap .mlab.u{transform:translate(-50%,calc(-100% - 12px))} .wmap .mlab.l{transform:translate(calc(-100% - 8px),-60%)} .wmap .mlab.r{transform:translate(8px,-60%)}
.wmap .mlab.here{background:#ffe9a8} .wmap .mlab.off{opacity:.55;background:#d8d4cc}
.wq{display:block;width:100%;text-align:left;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font-size:14px;font-family:inherit;cursor:pointer}
.dlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg-box{background:var(--panel);border:3px solid #1b1512;box-shadow:4px 4px 0 #000;border-radius:10px;padding:18px;max-width:340px;width:100%}
.dlg-msg{white-space:pre-line;line-height:1.6;margin-bottom:14px}
.dlg-btns{display:flex;gap:10px;justify-content:flex-end}
/* 全螢幕模式：揀咗案件之後，畫面填滿，對話、選單浮喺旁邊／下面 */
body.fs{padding:0;overflow:hidden;overscroll-behavior:none}
body.fs header, body.fs #nav{display:none}
body.fs .toast{bottom:calc(14px + env(safe-area-inset-bottom))}
.fs-root{position:fixed;inset:0;z-index:4;display:flex;flex-direction:column;background:#000}
.fs-hud{flex:none;display:flex;gap:6px;align-items:center;padding:4px max(8px,env(safe-area-inset-right)) 4px max(8px,env(safe-area-inset-left));padding-top:max(4px,env(safe-area-inset-top));background:#14100c;color:#cfc6b8;font-size:12px;line-height:1.2;min-height:34px;white-space:nowrap;overflow:hidden;border-bottom:1px solid #2a221b}
.fs-hud .hn{color:var(--text);font-size:13px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.fs-hud .sp{flex:1 1 0}
.hb{flex:none;background:#2a221b;color:#f1e6d4;border:1px solid #4a3c2e;border-radius:99px;padding:5px 10px;font-size:12.5px;font-family:inherit;line-height:1.1;cursor:pointer}
.hb.buddy{background:#1f3a24;border-color:#6fd46f;color:#d8ffd8;font-weight:700}
.hb.go{border-color:var(--accent);color:var(--accent)}
.fs-body{flex:1;min-height:0;display:flex;flex-direction:column}
.fs-stage{flex:none;display:flex;align-items:center;justify-content:center;background:#000}
.fs-root .world{margin:0;border:0;width:100%}
.fs-panel{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.fs-panel .card{margin-bottom:8px}
.fs-panel .wq{margin:5px 0;padding:9px 12px}
.wq.accent{border-color:var(--accent);color:var(--accent);font-weight:700}
@media (orientation:portrait){ .fs-stage{height:auto} .fs-stage .world canvas{height:56.25vw} .fs-root .wbtns{position:static;max-width:none;padding:6px 8px 2px;pointer-events:auto} }
@media (orientation:landscape){ .fs-empty{display:none} }
@media (orientation:landscape){
  /* 打橫：畫面大小固定不變，問話、選單浮在畫面右邊（不會一開一關畫面就縮放） */
  .fs-body{position:relative}
  .fs-stage{flex:1 1 0;min-height:0;container-type:size}
  .fs-stage .world{width:min(100cqw,177.78cqh)}
  .fs-panel{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right));width:clamp(260px,36vw,420px);max-height:calc(100% - 16px);background:none;padding:0;z-index:3;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.55)}
  .fs-panel > .card{margin:0;background:rgba(31,26,23,.96)} .fs-panel > .look{margin:0 4px 4px 0}
}
/* 大螢幕（電腦、iPad）：畫面放大時，對話框、指示牌、地圖標籤的字也跟著放大 */
.fs-root .world{container-type:inline-size}
.fs-root .wbubble{font-size:max(13.5px,1.2cqw);max-width:min(78%,60em)}
.fs-root .wbubble b{font-size:max(11px,.9cqw)}
.fs-root .wnav{font-size:max(12px,1.05cqw)}
.fs-root .wnav.go{font-size:max(14px,1.3cqw)}
.fs-root .wskip{font-size:max(12px,1cqw)}
.fs-root .wtip{font-size:max(11px,.9cqw)}
.fs-root .wroom,.fs-root .wgo{font-size:max(13px,1.15cqw)}
.fs-root .wmap .mlab{font-size:max(10.5px,1.05cqw)}
.fs-root .wmap .mlab i{font-size:max(9.5px,.9cqw)}
@media (min-width:1200px) and (min-height:700px){ .fs-hud{font-size:14.5px;min-height:42px} .fs-hud .hn{font-size:15.5px} .hb{font-size:14.5px;padding:6px 14px} .fs-panel{font-size:17px} }
.fs-sheet{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
.fs-sheet > .in{max-width:720px;margin:0 auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.wusay{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px}
.wusay .who{flex:none;font-size:26px;line-height:1}
.wusay .t{background:#fffdf7;color:#1b1512;border:2px solid #1b1512;box-shadow:3px 3px 0 #1b1512;padding:6px 10px;font-size:14px;line-height:1.55}
.wusay .t b{display:block;font-size:11px;color:#8a5a1a}
</style>

<header>
  <div class="hleft"><button class="hbtn" id="homeBtn" onclick="goHome()">‹ 案件</button><h1 id="caseTitle">偵探檔案</h1></div>
  <div class="clock" id="clock"><span class="t" id="clockT"></span><span class="bar"><i id="clockBar"></i></span></div>
</header>

  <button data-tab="search"><span class="ic">🔍</span>搜證</button>

</nav>

<script>
/* =========================================================
   遊戲邏輯（所有案件共用）

   三種案件格式：
   1. 單一階段（第 1 集）：questionLimit / searchLimit，問話＋搜證。
   2. 多階段（phases）：每階段各自有次數，可設 reports（自動拿到的報告）。
   3. 多地點（locations）：每天有行動點（actions），去一個地點用 cost 點（預設 1）。
      - 嫌疑人 where[階段] ＝ 那天在哪個地點（null ＝ 找不到人）；witness:true ＝ 證人，不能被指認
      - 證物 loc ＝ 在哪個地點查；地點 search ＝ 每次去能查幾項（可依階段給陣列）
      - 化驗 tests：要到 loc 送件（每次去最多 perVisit 件），days 天後結果才出來
      - phases[i].startAt ＝ 那天一開始就在的地點（不用行動點）
   共用：
      phase / until：從第幾階段開始有、到第幾階段為止
      requires（任一）/ requiresAll（全部）：要先知道哪些線索
      alt：問過 when 裡的問題或看過證據時，改用另一種問法／回答
      tl：[["10/17 20:16","說明"], ...] 會自動整理進筆記的「時間線」
      events：突發事件（atLoc＝人在那個地點時才發生；unless＝已知道這些就不發生）。條件（phase、requires…）一滿足就發生，可以是某天早上，也可以是玩家做了某件事之後
   ========================================================= */
let C = null, KEY = null, S = null;
let screen = "home", tab = "brief", openSuspect = null, openLoc = null, noteView = "key", noteWho = "all", accusePick = freshPick();

const saveKey = c => SLOT.caseKey(c.id);   // 每個存檔位各一份（arc.js 的 SLOT）；存檔 1 就是原本的 "detective_tw3_save_" + id
const phasesOf = c => c.phases || [{ title:null, short:"", questionLimit:c.questionLimit, searchLimit:c.searchLimit }];
const multi = () => !!C.phases;
const travel = () => !!C.locations;
const PH = () => phasesOf(C)[S.phase];
const lastPhase = () => S.phase >= phasesOf(C).length - 1;
const at = (arr, i) => Array.isArray(arr) ? arr[Math.min(i, arr.length-1)] : arr;
/* ---------- 時間制（clock）：問話、看監視器、查證物、送化驗、開車都會花時間 ----------
   C.clock（單一階段）或 phases[i].clock：{ start:"00:00", end:"02:00", ask:5, item:10, cctv:10, test:10, travel:60, tired:[["01:30",1]] }
   證物 / 監視器可以用 mins 指定要花幾分鐘；地點可以用 mins 指定車程。tired：到了那個時間，每個人願意回答的題數少幾題。 */
const CLK = () => (C.phases ? PH().clock : C.clock) || null;
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60 + m; };
const fmtMin = m => { m = ((m % 1440) + 1440) % 1440; return String(Math.floor(m/60)).padStart(2,"0") + ":" + String(m%60).padStart(2,"0"); };
const clkAt = (k, t) => { let m = toMin(t); if (m < toMin(k.start)) m += 1440; return m; };
const usedNow = () => ((S.used || {})[S.phase]) || 0;
const timeLeft = () => { const k = CLK(); return k ? Math.max(0, clkAt(k, k.end) - toMin(k.start) - usedNow()) : Infinity; };
const nowMin = () => toMin(CLK().start) + usedNow();
const nowStr = () => fmtMin(nowMin());
const tiredOf = () => { const k = CLK(); return !k || !k.tired ? 0 : k.tired.filter(([t]) => nowMin() >= clkAt(k, t)).reduce((n, [, d]) => n + d, 0); };
function spend(m){ if (!CLK() || !m) return; const tb = tiredOf(); (S.used = S.used || {})[S.phase] = usedNow() + m;
  if ((C.events||[]).some(e=>e.atTime && S.ev[e.id]===undefined)) setTimeout(checkEvents, 0);
  if (tiredOf() > tb) setTimeout(()=>toast(`🕐 ${nowStr()} 了，大家都累了，每個人願意回答的題數少了 ${tiredOf()-tb} 題。`), 1200); }
const costAsk = () => CLK() ? (CLK().ask || 5) : 0;
const costItem = it => CLK() ? (it.mins || (it.cctv ? (CLK().cctv || 10) : (CLK().item || 10))) : 0;
const costTest = () => CLK() ? (CLK().test || 10) : 0;
const costTravel = l => CLK() ? (l.mins || (l.cost || 1) * (CLK().travel || 60)) : 0;
const minLabel = m => m >= 60 ? `${Math.floor(m/60)} 小時${m%60 ? ` ${m%60} 分` : ""}` : `${m} 分鐘`;
const timeTag = () => CLK() ? `現在 ${nowStr()}，${C.clockEnd || "時間到"}還有 ${minLabel(timeLeft())}` : "";

function fresh(){ return { asked:[], seen:[], qp:{}, sp:{}, phase:0, visits:{}, labq:{}, ev:{}, used:{}, done:false, result:null }; }
function freshPick(){ return { kind:null, culprits:[], evidence:[], reasoning:{} }; }
function loadFor(c){
  try{ const s = JSON.parse(localStorage.getItem(saveKey(c)));
    if (s && s.asked){ s.qp=s.qp||{}; s.sp=s.sp||{}; s.phase=s.phase||0; s.visits=s.visits||{}; s.labq=s.labq||{}; s.ev=s.ev||{}; return s; } }catch(e){}
  return null;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} ARC.sync(); }

function openCase(i){
  C = CASES[i]; KEY = saveKey(C); S = loadFor(C) || fresh();
  (C.cctv||[]).forEach(c=>{ c.cctv = true; });   // 監視器畫面：顯示成 REC 畫面、選單用 📹
  if (S.rq){ S.rq = false; save(); }   // 重新進來：推理題是蓋著的
  ARC.open(); accusePick = freshPick(); openSuspect = null; openLoc = null; screen = "case"; tab = "brief"; checkEvents();
  wTalk = null; wSay = null; peek = null; mapFrom = null; wRoom = null; wGo = false; talkFrom = null;
  // 有畫面的案件：一揀完就直接進現場（第一晚的開場動畫會自動播）
  wBuddy = false; sheetFrom = null;
  if (art()){ if (travel()){ tab = "map"; openLoc = PH().startAt || null; } else tab = "scene"; }
  inter = null; if (interMaybe("before")){ sheetFrom = openLoc; tab = "accuse"; }   // 開場前的幕間（arc.js）
  render(); scrollTo(0,0);
  if (fsMode()){ goFull(); if (!S.fsTip){ S.fsTip = 1; save(); setTimeout(()=>toast("💡 筆記、案情、結案：點小吳或右上角「💬 小吳」"), 1500); } }
}
function goHome(){ screen = "home"; wBuddy = false; exitFull(); render(); scrollTo(0,0); }

/* ---------- 地點與行動點 ---------- */
const LOC = id => C.locations.find(l=>l.id===id);
const tests = () => C.tests || [];
const visitsToday = () => S.visits[S.phase] || [];
const here = id => !!id && (PH().startAt===id || visitsToday().includes(id));
const apLeft = () => !travel() ? 0 : CLK() ? (timeLeft() > 0 ? 99 : 0) : PH().actions - visitsToday().reduce((n,id)=>n+(LOC(id).cost||1),0);
const locOpen = l => (l.phase||0) <= S.phase && (l.until===undefined || l.until >= S.phase) && unlocked(l);
const whereOf = s => s.where ? at(s.where, S.phase) : null;
const testOpen = t => (t.phase||0) <= S.phase && (t.until===undefined || t.until >= S.phase) && unlocked(t);
const testReady = t => S.labq[t.id] !== undefined && S.phase >= S.labq[t.id] + t.days;
const readyTests = () => tests().filter(testReady);
const searchCap = l => at(l.search === undefined ? 99 : l.search, S.phase);
const searchLeftAt = l => CLK() ? (timeLeft() > 0 ? 99 : 0) : Math.max(0, searchCap(l) - S.seen.filter(id=>(S.sp[id]||0)===S.phase && (allItems().find(x=>x.id===id)||{}).loc===l.id).length);
const testsLeftAt = l => Math.max(0, (l.perVisit||0) - tests().filter(t=>t.loc===l.id && S.labq[t.id]===S.phase).length);

async function visit(id){
  const l = LOC(id);
  if (mapBusy) return;
  const from = mapFrom || PH().startAt;
  if (CLK() && here(id) && id !== from && !S.done){
    // 時間制：開車回今天去過的地方也要花時間
    const m = costTravel(l);
    if (timeLeft() < m){ toast(`來不及了：開過去要 ${minLabel(m)}`); return; }
    if (!await uiConfirm(`開回「${l.name}」？\n開車要 ${minLabel(m)}。\n${timeTag()}。`)) return;
    spend(m); save();
  }
  if (!here(id)){
    if (S.done) return;
    const cost = l.cost||1;
    if (CLK()){
      const m = costTravel(l);
      if (timeLeft() < m){ toast(`來不及了：開過去要 ${minLabel(m)}`); return; }
      if (!await uiConfirm(`前往「${l.name}」？\n開車要 ${minLabel(m)}。\n${timeTag()}。`)) return;
      spend(m);
    } else {
      if (apLeft() < cost){ toast("今天的行動點不夠了"); return; }
      if (!await uiConfirm(`前往「${l.name}」？\n會用掉 ${cost} 個行動點（今天還剩 ${apLeft()} 點）。`)) return;
    }
    (S.visits[S.phase] = S.visits[S.phase] || []).push(id); save(); wNews = checkEvents().filter(e=>e.atLoc===id);
  }
  if (art() && mapCtl && document.getElementById("mapcv")){ if (mapBusy) return; mapBusy = true; renderClock(); await new Promise(r=>mapCtl.drive(id, r)); mapBusy = false; }
  wArrive = art() && mapFrom && id !== mapFrom ? id : null;
  openLoc = id; openSuspect = null; peek = null; wRoom = null; wGo = false; wTalk = null; wSay = null; render(); scrollTo(0,0);
}
async function submitTest(id, sure){
  const t = tests().find(x=>x.id===id), l = LOC(t.loc);
  if (S.done || !here(l.id) || S.labq[id]!==undefined || testsLeftAt(l)<=0 || !testOpen(t)) return;
  if (CLK() && timeLeft() < costTest()){ toast("今天來不及了"); return; }
  if (!sure && !await uiConfirm(`送去化驗「${t.title}」？\n結果要等 ${t.days} 天才會出來。這次還能送 ${testsLeftAt(l)} 件。${CLK() ? `\n填單、交件要 ${minLabel(costTest())}。${timeTag()}。` : ""}`)) return;
  spend(costTest());
  S.labq[id] = S.phase; checkEvents(); save(); render();
  toast(`🧪 已送出，${t.days} 天後會有結果`);
}

/* ---------- 像素場景（案件有 art:true 才會畫） ---------- */
const art = () => !!C.art && typeof PX !== "undefined";
let lastSaid = null;   // { sid, qid }：剛剛回答的問題，用來顯示對話框
function lookOf(s){
  if (!s.look) return null;
  const L = Object.assign({}, s.look);
  Object.keys(s.look.byPhase||{}).forEach(k=>{ if (S.phase >= +k) Object.assign(L, s.look.byPhase[k]); });
  delete L.byPhase; return L;
}
function sceneHTML(name, opt, extraClass="", hot){
  return `<div class="scene ${extraClass}"><canvas data-scene="${name}" data-opt='${JSON.stringify(opt||{}).replace(/'/g,"&#39;")}'${hot?` data-hot='${JSON.stringify(hot).replace(/'/g,"&#39;")}' class="tap"`:""}></canvas></div>`;
}
// 監視器／錄影動畫
function animHTML(it, auto){
  const id = it.id;
  return `<div class="scene"><canvas data-anim="${it.id}" data-auto="${auto?1:0}" class="tap"></canvas><div class="cap"></div>
    <div class="ctl"><button onclick="animDo(this,'toggle')">▶︎ 播放／暫停</button><button onclick="animDo(this,'restart')">↺ 從頭看</button><span style="margin-left:auto;align-self:center;font-size:12px;opacity:.7">${esc(((id==="__replay"?(C.court||{}).replay:it.anim)||{}).cam||"")}</span></div></div>`;
}
function animDo(btn, how){ const cv = btn.closest(".scene").querySelector("canvas"); cv._ctl && cv._ctl[how](); }
const extraLook = id => (C.looks && C.looks[id]) || null;
function looksFor(id){ if (id==="_you") return (C.court && C.court.detective) || DETECTIVE; const s = C.suspects.find(x=>x.id===id); return (s && lookOf(s)) || extraLook(id) || ARC.look(id); }
function drawScenes(){
  document.querySelectorAll("canvas[data-scene]").forEach(cv=>{
    const opt = JSON.parse(cv.dataset.opt||"{}");
    if (opt.who) opt.people = opt.who.map(id=>looksFor(id)).filter(Boolean);
    if (opt.cast) opt.people = opt.cast.map(c=>({ ...c, L: looksFor(c.id) })).filter(c=>c.L);
    const hits = PX.draw(cv, cv.dataset.scene, opt);
    if (cv.dataset.hot){
      const hot = JSON.parse(cv.dataset.hot);
      cv.onclick = e=>{
        const r = cv.getBoundingClientRect(), x = (e.clientX-r.left)*PX.W/r.width, y = (e.clientY-r.top)*PX.H/r.height;
        const inR = (q)=> x>=q[0] && x<=q[0]+q[2] && y>=q[1] && y<=q[1]+q[3];
        // 先看還沒查的證物（小），再看人，最後才是其他地方
        const fresh = hot.spots.find(q=>q.k==="item" && q.fresh && inR(q.r));
        if (fresh) return tapSpot(fresh);
        const p = hits.find(h=>x>=h.x && x<=h.x+h.w && y>=h.y && y<=h.y+h.h);
        if (p && hot.people) return tapPerson(p.id);
        const h = hot.spots.filter(q=>inR(q.r)).sort((a,b)=>a.r[2]*a.r[3]-b.r[2]*b.r[3])[0];
        if (h) return tapSpot(h);
        toast("這裡看起來沒什麼特別的。");
      };
    }
  });
  const wc = document.getElementById("worldcv");
  if (wc){ const l = curLoc(), def = worldDef(l); if (def) WORLD.mount(wc, def, l.id, curHooks = worldHooks(l, def)); }
  const mc = document.getElementById("mapcv");
  if (mc) mapCtl = WK.drawMap(mc, mapFrom || PH().startAt || C.locations[0].id);
  document.querySelectorAll("canvas[data-anim]").forEach(cv=>{
    const it = cv.dataset.anim==="__replay" ? { anim:(C.court||{}).replay } : [...allItems(), ...tests()].find(x=>x.id===cv.dataset.anim); if (!it || !it.anim) return;
    const cap = cv.parentNode.querySelector(".cap");
    cv._ctl = PX.play(cv, it.anim, looksFor, (t,end)=>{ cap.textContent = t || (end ? "（播放結束）" : "…"); }, cv.dataset.auto==="1");
    cv.onclick = ()=>cv._ctl.toggle();
  });
  const b = document.querySelector(".bubble[data-type]");
  if (b){ const full = b.dataset.type; let i = 0; const el = b.querySelector(".say-text"); el.textContent = "";
    clearInterval(window._tw); window._tw = setInterval(()=>{ i += 2; el.textContent = full.slice(0,i); if (i >= full.length) clearInterval(window._tw); }, 22);
    b.onclick = ()=>{ clearInterval(window._tw); el.textContent = full; }; }
}

/* ---------- 可以走進去的房間、可以點的東西 ---------- */
let openRoom = {}, peek = null;   // peek：剛剛點開的東西 { kind:"item"|"detail", id }
const roomsOf = l => (C.rooms && C.rooms[l.id]) || [{ id:l.id, name:l.name, scene:l.scene||l.id }];
const roomOpen = r => (r.phase===undefined || S.phase>=r.phase) && (r.until===undefined || S.phase<=r.until) && (!r.requires || unlocked(r));
const curRoom = l => { const rs = roomsOf(l).filter(roomOpen); return rs.find(r=>r.id===openRoom[l.id]) || rs[0]; };
const dailyOf = s => (s.daily && at(s.daily, S.phase)) || {};
const roomOfPerson = (s, l) => dailyOf(s).room || roomsOf(l)[0].id;
const allDetails = () => Object.values(C.rooms||{}).flat().flatMap(r=>(r.details||[]).map(d=>({ ...d, room:r.id })));
const detailOpen = d => (d.phase===undefined || S.phase>=d.phase) && (d.until===undefined || S.phase<=d.until) && unlocked(d);
const HOME = { id:"_", name:"現場" };   // 沒有地點的案件（第 1 集）：整個現場當成一個地點
const itemsInRoom = (l, r) => allItems().filter(it=>(it.loc||"_")===l.id && it.hot && (it.room||roomsOf(l)[0].id)===r.id && (S.seen.includes(it.id) || (itemOpen(it) && unlocked(it))));
function goRoom(lid, rid){ openRoom[lid] = rid; peek = null; render(); }
function tapPerson(id){ if (!travel()) tab = "suspects"; openSuspect = id; lastSaid = null; render(); scrollTo(0,0); }
function tapSpot(h){
  const l = travel() ? LOC(openLoc) : HOME;
  if (h.k==="go"){ goRoom(l.id, h.to); return; }
  if (h.k==="detail"){ S.found = S.found || []; const isNew = !S.found.includes(h.id); if (isNew){ S.found.push(h.id); save(); } peek = { kind:"detail", id:h.id, isNew }; render(); if (isNew && fsMode()) toast(`🔎 發現小細節！（${S.found.length}／${allDetails().length}）`); return; }
  if (h.k==="item"){
    const ids = h.ids, fresh = ids.find(id=>!S.seen.includes(id));
    // 不會一點就查：先跳出確認（要花多少時間／次數），監視器可以選要看哪一段
    if (fresh && !S.done){ peek = null; wAct = { ids }; render(); return; }
    peek = { kind:"item", id:ids[ids.length-1] }; render();
  }
}
function doAct(id){
  const it = allItems().find(x=>x.id===id);
  if (S.seen.includes(id)){ const from = wAct && wAct.ids.length > 1 ? wAct.ids : null; wAct = null; peek = { kind:"item", id, from }; render(); return; }
  const l = travel() ? LOC(openLoc) : HOME;
  if ((travel() ? searchLeftAt(l) : searchLeft()) <= 0){ toast(CLK() ? "⏰ 沒時間了" : "這裡今天已經查不了更多了。"); return; }
  const from = wAct && wAct.ids.length > 1 ? wAct.ids : null;
  inspectById(id); if (S.seen.includes(id)){ wAct = null; peek = { kind:"item", id, from }; render(); }
}
function actCard(l){
  const its = wAct.ids.map(id=>allItems().find(x=>x.id===id)).filter(Boolean);
  const cctv = its.some(it=>it.cctv), sl = travel() ? searchLeftAt(l) : searchLeft();
  const cost = it => CLK() ? `約 ${minLabel(costItem(it))}` : "用 1 次";
  const left = CLK() ? `${timeTag()}。` : `${travel() ? "這裡這次" : ""}還能查 ${sl} 項。`;
  return `<div class="card" style="padding:12px 14px"><div style="display:flex;justify-content:space-between;align-items:center"><b>${cctv ? "📹 監視器主機" : "🧾 " + esc(its[0].title)}</b><button class="back" style="margin:0" onclick="wAct=null;render()">先不要 ✕</button></div>
    <div class="muted small" style="margin:2px 0 4px">${cctv ? "要看哪一段？有些錄影可能什麼都沒拍到。" : "要調查這個嗎？"}${left}</div>
    ${its.map(it=>S.seen.includes(it.id)
      ? `<button class="wq" onclick="doAct('${it.id}')">${it.cctv?"📹":"🧾"} ${esc(it.title)} <span class="tag">看過了・重看不用時間</span></button>`
      : `<button class="wq" style="border-color:var(--accent)" ${S.done||sl<=0||(CLK()&&timeLeft()<costItem(it))?"disabled":""} onclick="doAct('${it.id}')">${it.cctv?"▶️ 看":"🔍 調查"}「${esc(it.title)}」 <span class="tag cost">${cost(it)}</span></button>`).join("")}</div>`;
}
function itemBody(it, auto){
  return `${art() && it.anim ? animHTML(it, auto) : art() && it.scene ? sceneHTML(it.scene, it.sceneOpt) : ""}${it.cctv?`<div class="cctv"><span class="rec">● REC</span>\n${esc(it.text)}</div>`:`<div class="muted">${nl(it.text)}</div>`}`;
}
function roomBlock(l){
  const rooms = roomsOf(l).filter(roomOpen), r = curRoom(l);
  const ppl = C.suspects.filter(s=>!isGone(s) && (!travel() || whereOf(s)===l.id) && roomOfPerson(s,l)===r.id);
  const items = itemsInRoom(l, r);
  const dets = (r.details||[]).filter(detailOpen);
  const unseen = it => !S.seen.includes(it.id);
  const ropt = typeof r.opt === "function" ? r.opt(S.phase, has) : (r.opt||{});
  const groups = {};
  items.forEach(it=>{ const k = it.hot.join(","); (groups[k] = groups[k] || { r:it.hot, ids:[] }).ids.push(it.id); });
  const spots = [
    ...Object.values(groups).map(g=>({ k:"item", r:g.r, ids:g.ids, fresh: g.ids.some(id=>!S.seen.includes(id)) })),
    ...dets.map(d=>({ k:"detail", r:d.hot, id:d.id })),
    ...(r.go||[]).filter(g=>{ const t = roomsOf(l).find(x=>x.id===g.to); return t && roomOpen(t); }).map(g=>({ k:"go", r:g.hot, to:g.to }))
  ];
  const cast = ppl.map((s,i)=>{ const d = dailyOf(s); return { id:s.id, x: d.x!==undefined ? d.x : 30+i*28, y: d.y, pose: d.pose, facing: d.facing||1 }; });
  const marks = Object.values(groups).filter(g=>g.ids.some(id=>{ const it = allItems().find(x=>x.id===id); return unseen(it) && itemOpen(it); })).map(g=>[g.r[0]+g.r[2]/2|0, g.r[1]+3]);
  const opt = { ...ropt, phase:S.phase, cast, marks };
  const nUnseen = rr => itemsInRoom(l, rr).filter(it=>unseen(it) && itemOpen(it) && unlocked(it)).length;
  const chips = rooms.length>1 ? `<div class="rooms">${rooms.map(x=>`<button class="${x.id===r.id?"on":""}" onclick="goRoom('${l.id}','${x.id}')">${esc(x.name)}${nUnseen(x)?'<span class="dot">✦</span>':""}</button>`).join("")}</div>` : "";
  let look = "";
  if (peek && peek.kind==="detail"){ const d = dets.find(x=>x.id===peek.id); if (d) look = `<div class="look"><b>🔎 ${esc(d.name||"你注意到")}</b>${nl(d.text)}${peek.isNew?`<div class="found" style="margin-top:4px">發現小細節！（${(S.found||[]).length}／${allDetails().length}）</div>`:""}</div>`; }
  if (peek && peek.kind==="item"){ const it = allItems().find(x=>x.id===peek.id); if (it && S.seen.includes(it.id)) look = `<div class="look"><b>🧾 ${esc(it.title)}</b>${itemBody(it, true)}</div>`; }
  const doing = ppl.filter(s=>dailyOf(s).doing).map(s=>`<div>👤 <span onclick="tapPerson('${s.id}')">${esc(s.name.replace(/（.*）/,""))}</span>：${esc(dailyOf(s).doing)}</div>`).join("");
  return `${chips}${sceneHTML(r.scene, opt, "", { people:true, spots })}
    <p class="hint">點畫面：人可以問話，<span style="color:#ffd04a">✦</span> 是還沒查的東西，其他地方也可能藏著小細節。</p>
    ${look}${doing?`<div class="doing">${doing}</div>`:""}`;
}

/* ---------- 走動模式（橫向動畫場景） ---------- */
let wAct = null, wChat = false;   // wAct：點到東西後先問要不要查（{ ids }）；wChat：已經按了「開始問話」
let wTalk = null, wSay = null, wArrive = null, wNews = [], mapFrom = null, mapCtl = null, mapBusy = false;
const curLoc = () => travel() ? (openLoc ? LOC(openLoc) : null) : HOME;
// 每個地點都有走動畫面：有手畫的就用手畫的（C.world[id]），沒有就把房間自動排成剖面建築
function worldDef(l){
  if (!l || !art() || typeof WORLD === "undefined" || typeof WK === "undefined") return null;
  const w = C.world && C.world[l.id];
  if (w && !w.auto && (!w.when || w.when(S.phase))) return w;

    const cx = r[0] + r[2]/2, cy = r[1] + r[3]/2, a = (def.areas||[]).filter(a=>cx>=a.x0 && cx<=a.x1 && (a.y ?? FLOOR) >= cy - 2).sort((a,b)=>(a.y ?? FLOOR)-(b.y ?? FLOOR))[0]; return a && a.id === aid; };
  const all = allDetails().filter(d=>detailOpen(d) && (def.auto ? roomsOf(l).some(r=>r.id===d.room) : true) && inA(d));
  return { n: all.length, found: all.filter(d=>(S.found||[]).includes(d.id)).length };
}
function areaItems(l, def, aid){

const reportsGot = () => phasesOf(C).slice(0, S.phase+1).flatMap(p=>p.reports||[]);

const has = id => ARC.is(id) ? ARC.test(id) : has0(id);

// 突發事件：條件一滿足就發生（可能連鎖）
function checkEvents(){
  let fired = [], changed = true;
  while (changed){ changed = false;
    for (const e of (C.events||[])) if (S.ev[e.id]===undefined && unlocked(e) && (!e.atLoc || here(e.atLoc)) && (!e.atTime || timeReached(e.atTime)) && (!e.unless || !e.unless.some(has))){ S.ev[e.id] = S.phase; fired.push(e); changed = true; }
  }
  if (fired.length){ save();
    // atTime / popup：時間一到就跳出來（例如綁匪打電話來），不是只在角落提示
    const sc = fired.filter(e=>e.scene);   // 有 scene 的事件：播一段場面（可以有選擇、限時行動，見 arc.js）
    if (sc.length) setTimeout(()=>sc.forEach(e=>interPlay(e.scene, "ev:" + e.id)), 700);
    const pop = fired.filter(e=>(e.atTime || e.popup) && !e.scene);
    if (pop.length) setTimeout(()=>pop.forEach(e=>uiAlert(`📞 ${nowStr()}　${e.title}\n\n${String(e.text).replace(/<[^>]+>/g,"")}`)), 700);
    const rest = fired.filter(e=>!e.atTime && !e.popup && !e.scene);
    if (rest.length) setTimeout(()=>toast("📢 " + rest.map(e=>e.title).join("、") + "（詳情在「案情」）"), 900); }
  return fired;
}
const isGone = s => (s.gone !== undefined && S.phase >= s.gone);
const askedNow = s => s.questions.filter(q=>S.asked.includes(q.id) && (S.qp[q.id]||0)===S.phase).length;
const reachable = s => !isGone(s) && (!travel() || here(whereOf(s)));
const qLeft = s => !reachable(s) ? 0 : Math.max(0, PH().questionLimit - tiredOf() - askedNow(s));
const searchLeft = () => travel()
  ? C.locations.filter(l=>here(l.id)).reduce((n,l)=>n+searchLeftAt(l),0)
  : CLK() ? (timeLeft() > 0 ? 99 : 0)
  : Math.max(0, PH().searchLimit - S.seen.filter(id=>(S.sp[id]||0)===S.phase).length);
const totalQLeft = () => C.suspects.reduce((n,s)=>n+qLeft(s),0);
const allItems = () => [...C.cctv, ...C.evidence];
const itemOpen = it => (it.phase||0) <= S.phase && (it.until===undefined || it.until >= S.phase);
const canDig = () => (CLK() ? timeLeft() > 0 && (totalQLeft()+searchLeft()) > 0 : totalQLeft()+searchLeft() > 0 || apLeft() > 0) || (multi() && !lastPhase());
const evidencePool = () => [...allItems().filter(it=>S.seen.includes(it.id)), ...readyTests()];

function renderClock(){
  const P = PH();
  let t, frac;
  if (CLK()){
    t = `${P.short ? P.short + "　" : ""}🕐 ${nowStr()}　⏳${minLabel(timeLeft())}`;
    frac = timeLeft() / (clkAt(CLK(), CLK().end) - toMin(CLK().start));
  } else if (travel()){
    t = `${P.short}　🚗${apLeft()}`;
    frac = P.actions ? apLeft()/P.actions : (totalQLeft()+searchLeft() ? 1 : 0);
  } else {
    t = (P.short ? P.short + "　" : "") + "🗣️" + totalQLeft() + "　🔍" + searchLeft();
    const total = C.suspects.filter(s=>!isGone(s)).length*P.questionLimit + P.searchLimit;
    frac = (totalQLeft()+searchLeft())/total;
  }
  document.getElementById("clockT").textContent = t;
  document.getElementById("clockBar").style.width = Math.max(0,Math.min(1,frac))*100+"%";
  document.getElementById("clock").classList.toggle("low", frac <= .25);
}

function ask(sus, q){
  if (S.asked.includes(q.id) || qLeft(sus) <= 0 || S.done || !unlocked(q)) return;
  if (CLK() && timeLeft() < costAsk()){ toast("⏰ 沒時間了"); return; }
  const before = availCount();
  spend(costAsk());
  (S.variant = S.variant || {})[q.id] = q.alt && q.alt.when.some(has) ? "alt" : "base";
  S.asked.push(q.id); S.qp[q.id] = S.phase; lastSaid = { sid:sus.id, qid:q.id }; afterSpend(); render();
  if (availCount() > before) setTimeout(()=>toast("🔓 聽到新線索，可以拿去問其他人"), 400);
  if (qLeft(sus)===0) setTimeout(()=>toast(sus.name + (multi() && !lastPhase() ? "：「今天就到這裡吧，我累了。」" : "：「我不會再回答了，等我的律師來。」")), 300);
}
function inspect(item){
  if (S.seen.includes(item.id) || S.done || !itemOpen(item) || !unlocked(item)) return;
  if (travel() ? (!here(item.loc) || searchLeftAt(LOC(item.loc))<=0) : searchLeft()<=0) return;
  if (CLK() && timeLeft() < costItem(item)){ toast(`⏰ 時間不夠：這個要 ${minLabel(costItem(item))}`); return; }
  const before = availCount();
  spend(costItem(item));
  S.seen.push(item.id); S.sp[item.id] = S.phase; afterSpend(); render();
  if (availCount() > before) setTimeout(()=>toast("🔓 有新的問題或地方可以查了"), 400);
}

function courtSteps(){
  const r = S.result, P = r.pick, sol = C.solution, K = C.court || {};

  steps.push({ who:"narr", text: (typeof K.open==="function" ? K.open(S.phase) : K.open) || "所有人都被叫到了一起。大家看著你，等你開口。" });
  const kd = C.kinds.find(k=>k.id===P.kind);
  steps.push({ who:"you", text: (K.kindLine && K.kindLine[P.kind]) || `我的結論是——${kd ? kd.label.replace(/^(.{2,4})：/,"$1。") : "……"}` });
  if (whoKind(P.kind)){
    C.reasoning.forEach((q,i)=>{ if (reasonFor(q, P.kind) && P.reasoning[i]!==undefined) steps.push({ who:"you", text:`${q.q}\n——${q.options[P.reasoning[i]]}。` }); });
    if ((K.murmur||[]).length) steps.push({ who:"narr", text:K.murmur[(S.tries||1) % K.murmur.length] });
    steps.push({ who:"you", text:`${(kd && kd.whoLine) || "這一切的兇手，就是"}——${P.culprits.map(nm).join("、")}！`, focus:P.culprits });
    P.culprits.forEach(id=>{
      const guilty = sol.culprits.includes(id);
      const line = guilty ? (r.verdict==="perfect" ? (K.confess||{})[id] : (K.cornered||{})[id]) : (K.deny||{})[id];
      const def = guilty ? (r.verdict==="perfect" ? "……是我。" : "……你什麼都不懂。") : "我？你有什麼證據？";

    ${kinds.map(k=>`<div class="pick ${P.kind===k.id?"on":""}" onclick="pickKind('${k.id}')"><span class="box">${P.kind===k.id?"✓":""}</span>${esc(k.label)}</div>`).join("")}
    ${lockedKinds?`<p class="muted small">🔒 還有 ${lockedKinds} 種可能性，要先發現相關線索才會出現。</p>`:""}
  </div>
  ${murder?`<div class="card"><h3>${n++}. ${esc(whoTitle(P.kind))}</h3>
    ${people.map(s=>`<div class="pick ${P.culprits.includes(s.id)?"on":""}" onclick="toggleCulprit('${s.id}')"><span class="box">${P.culprits.includes(s.id)?"✓":""}</span>${s.av} ${esc(s.name)}</div>`).join("")}
    <p class="muted small">🔒 調查中出現的其他人物，也會加進這裡。</p>
  </div>
  ${!rqN ? "" : !S.rq ? `<div class="card"><h3>🧩 推理題（${rqN} 題，先蓋著）</h3>
    <p class="muted small" style="margin:0 0 8px"><b>一打開推理題，就算用掉一次推理機會</b>，看了不提交也算。這會是你第 ${(S.tries||0)+1} 次推理：第一次就全對才有 S，第二次最高 A，之後最高 B。<br>題目本身也是提示，所以想清楚、查夠了再打開。離開這一頁，題目會再蓋起來。</p>
    <button class="btn primary" style="text-align:center" onclick="openReasoning()">打開推理題（用掉一次機會）</button></div>`
  : C.reasoning.map((r,i)=>!reasonFor(r, P.kind)?"":`<div class="card"><h3>${n++}. ${esc(r.q)}</h3>
    ${r.options.map((o,j)=>`<div class="pick ${P.reasoning[i]===j?"on":""}" onclick="pickReason(${i},${j})"><span class="box">${P.reasoning[i]===j?"✓":""}</span>${esc(o)}</div>`).join("")}</div>`).join("")}
  ${lockedR?`<div class="card"><p class="muted small" style="margin:0">🔒 還有 ${lockedR} 題推理題，要先發現相關線索才會出現。沒出現的題目不會得分。</p></div>`:""}`:""}
  ${P.kind===null?"":`<div class="card"><h3>${n++}. 選最多 3 項關鍵證據</h3>
    ${seenItems.length?seenItems.map(it=>`<div class="pick ${P.evidence.includes(it.id)?"on":""}" onclick="toggleEv('${it.id}')"><span class="box">${P.evidence.includes(it.id)?"✓":""}</span>${esc(it.title)}</div>`).join("")
    :`<p class="muted small">你還沒看過任何監視器或證物，只能憑直覺了。</p>`}
  </div>
  <button class="btn primary" onclick="submitAccuse()">確定提交</button>`}`;
}
function pickKind(v){ accusePick.kind=v; if(!whoKind(v)) accusePick.culprits=[]; render(); }
function toggleCulprit(id){ const c=accusePick.culprits; c.includes(id)?c.splice(c.indexOf(id),1):c.push(id); render(); }
function pickReason(i,j){ accusePick.reasoning[i]=j; render(); }
// 推理題平常蓋著：一打開就算用掉一次推理機會（題目本身就是提示），離開推理頁就再蓋起來
async function openReasoning(){
  if (S.done || S.rq) return;
  const nth = (S.tries||0) + 1;
  if (!await uiConfirm(`打開推理題？\n一打開就算用掉一次推理機會，看了不提交也算。\n這是你第 ${nth} 次推理${nth===1 ? "，第一次就全對才有 S。" : nth===2 ? "，最高只能拿 A。" : "，最高只能拿 B。"}`)) return;
  S.rq = true; S.tries = nth; save(); render();
}
function toggleEv(id){ const e=accusePick.evidence; if(e.includes(id)) e.splice(e.indexOf(id),1); else if(e.length<3) e.push(id); else toast("最多選 3 項"); render(); }
async function submitAccuse(){
  const P = accusePick, murder = whoKind(P.kind);
  if (murder && !P.culprits.length){ toast(P.kind==="murder" ? "請至少選一名兇手" : "請至少選一個人"); return; }
  if (murder && C.reasoning.some((r,i)=>reasonFor(r, P.kind) && P.reasoning[i]===undefined)){ toast(S.rq ? "推理題還沒答完" : "要先打開推理題，把題目答完"); return; }
  if (!await uiConfirm("確定提交你的推理？")) return;
  const sol = C.solution;
  let verdict;
  if (P.kind !== sol.kind) verdict = "wrong";
  else if (!murder) verdict = "perfect";
  else {
    const right = P.culprits.filter(x=>sol.culprits.includes(x)).length;
    const wrongN = P.culprits.length - right;
    verdict = (right===sol.culprits.length && !wrongN) ? "perfect" : right>0 ? "partial" : "wrong";
  }
  const evHits = P.evidence.filter(e=>sol.keyEvidence.includes(e)).length;
  const reasonHits = murder ? C.reasoning.filter((r,i)=>reasonFor(r, P.kind) && P.reasoning[i]===r.answer).length : 0;
  const pts = evHits + reasonHits, max = 3 + C.reasoning.filter(r=>!r.kinds || r.kinds.includes(sol.kind)).length;   // 第 1 集：滿分 6
  let grade;
  if (verdict==="perfect") grade = pts>=max ? "S" : pts>=Math.ceil(max*2/3) ? "A" : "B";
  else if (verdict==="partial") grade = pts>=Math.ceil(max/2) ? "C" : "D";
  else grade = "F";
  // 第一次就推理正確才有 S；第二次最高 A，第三次以後最高 B
  // 推理題一打開就已經算了一次（S.rq）；沒有推理題、或沒打開就提交的，這裡才算
  const nth = S.rq ? (S.tries||1) : (S.tries||0) + 1;
  if (verdict==="perfect" && nth === 2 && grade === "S") grade = "A";
  if (verdict==="perfect" && nth >= 3 && grade !== "B") grade = "B";
  S.done = true;
  S.tries = nth; S.rq = false;
  S.revealed = verdict==="perfect";
  S.result = { verdict, evHits, reasonHits, grade, pick: JSON.parse(JSON.stringify(P)), qUsed:S.asked.length, sUsed:S.seen.length + Object.keys(S.labq).length };
  if (art()) S.court = 0;
  save(); render(); scrollTo(0,0);
}
function vResult(){
  const r = S.result, sol = C.solution, murder = whoKind(r.pick.kind);
  const rq = C.reasoning.map((q,i)=>[q,i]).filter(([q])=>!q.kinds || q.kinds.includes(r.pick.kind));
  const msg = { perfect:"完全正確！你揪出了所有兇手。", partial:"抓到部分真相，但有兇手逃過一劫，或是你冤枉了好人。", wrong:"推理錯誤，真兇逍遙法外。" }[r.verdict];
  const everyone = [...C.suspects, ...C.extraPeople];
  const pickName = murder ? (r.pick.kind==="murder" ? "他殺：" : kindOf(r.pick.kind).label.replace(/：.*/,"") + "：") + r.pick.culprits.map(id=>everyone.find(s=>s.id===id).name).join("、") : kindOf(r.pick.kind).label;
  const shown = S.revealed !== false;   // 舊存檔沒有這個欄位，視為已公布
  const answers = !murder || !shown ? "" : `<div class="card"><h3>🧩 推理題</h3>${rq.map(([q,i])=>{
    const mine = r.pick.reasoning[i], ok = mine===q.answer;
    return `<p style="margin:6px 0">${ok?"✅":"❌"} ${esc(q.q)}<br><span class="muted small">答案：${esc(q.options[q.answer])}${ok?"":`（${mine===undefined?"你沒有作答":"你選："+esc(q.options[mine])}）`}</span></p>`;}).join("")}</div>`;
  const dig = canDig();
  const digText = travel() ? (apLeft()||!lastPhase() ? "你還有時間，可以回去繼續調查，" : "調查的時間已經用完，但你可以重新整理筆記，")
    : totalQLeft()+searchLeft()>0 ? `你${multi()?"今天":""}還有 ${totalQLeft()} 題可問、${searchLeft()} 項可查，可以回去繼續調查，`
    : multi() && !lastPhase() ? "今天的次數用完了，但你可以進入下一天繼續調查，"
    : "調查的機會已經用完，但你可以重新整理筆記，";
  const tail = shown ? `${answers}
  <div class="card"><h3>📜 真相</h3>${sol.truth.map(p=>`<p>${p}</p>`).join("")}</div>
  <button class="btn primary" onclick="restart(true)">再玩一次</button>
  <button class="btn" style="text-align:center" onclick="goHome()">回到案件列表</button>`
  : `<div class="card"><h3>🤔 真相還沒公布</h3><p class="muted small" style="margin:0">你的推理還不完全正確。${digText}再推理一次。這是你第 ${S.tries||1} 次推理。</p></div>
  <button class="btn primary" onclick="retry()">${dig?"繼續調查，再推理一次":"再推理一次"}</button>
  <button class="btn" style="text-align:center" onclick="reveal()">我放棄，直接看真相</button>
  <button class="btn danger" onclick="restart()">整個案件重新開始</button>`;
  return `${art()?`<button class="btn" style="text-align:center;margin-top:0" onclick="S.court=0;save();render();scrollTo(0,0)">🎬 重看結案過程</button>`:""}${interBtns()}<div class="card" style="text-align:center"><div class="muted small">評級</div>
    <div class="grade" style="color:${r.grade==="F"?"var(--red)":r.grade==="S"?"var(--accent)":"var(--text)"}">${r.grade}</div>
    <p style="margin:4px 0">${msg}</p>
    <p class="muted small" style="margin:0">你的推理：${esc(pickName)}<br>關鍵證據 ${r.evHits}/3${murder?`　推理題 ${r.reasonHits}/${rq.length}`:""}<br>問了 ${r.qUsed} 題、查了 ${r.sUsed} 項${allDetails().length ? `、發現小細節 ${(S.found||[]).length}／${allDetails().length}` : ""}<br>第 ${S.tries||1} 次推理${(S.tries||1) > 1 && r.verdict==="perfect" ? "（第一次就全對才有 S）" : ""}</p></div>
  ${tail}`;
}
function retry(){ S.done=false; S.result=null; accusePick=freshPick(); save(); go(travel()?"brief":totalQLeft()+searchLeft()>0?"notes":multi()&&!lastPhase()?"brief":"accuse"); }
async function reveal(){ if(!await uiConfirm("確定要看真相？看了就沒有懸念了。")) return; S.revealed=true; save(); interMaybe("after"); render(); scrollTo(0,0); }

async function restart(skipConfirm){
  if (!skipConfirm && !await uiConfirm("清除所有進度，重新開始？")) return;
  S = fresh(); accusePick = freshPick(); openSuspect=null; openLoc=null; save();
  if (art() && typeof WORLD !== "undefined"){ (travel() ? C.locations.map(l=>l.id) : ["_"]).forEach(id=>WORLD.reset(id)); openCase(CASES.indexOf(C)); return; }
  go("brief");
}
function go(t){
  if (fsMode()){ if (SHEETS.includes(t)){ openSheet(t); return; }
    if (SHEETS.includes(tab) && (t==="map" || t==="scene")){ closeSheet(); return; } }
  if (openLoc) mapFrom = openLoc; tab=t; openSuspect=null; lastSaid=null; wTalk=null; wSay=null; peek=null; if(t!=="map" || art()) openLoc=null; render(); scrollTo(0,0); }
function renderNav(){
  const tabs = art()
    ? [[travel()?"map":"scene", travel()?"🗺️":"🏠", travel()?"地圖":"現場"],["notes","📓","筆記"],["brief","📁","案情"],["accuse","⚖️","推理"]]
    : travel()
    ? [["brief","📁","案情"],["map","🗺️","地點"],["notes","📓","筆記"],["accuse","⚖️","推理"]]
    : [["brief","📁","案情"],["suspects","🗣️","問話"],["search","🔍","搜證"],["notes","📓","筆記"],["accuse","⚖️","推理"]];
  const nav = document.getElementById("nav");
  nav.innerHTML = tabs.map(([k,ic,l])=>`<button data-tab="${k}" class="${tab===k?"on":""}"><span class="ic">${ic}</span>${l}</button>`).join("");
  nav.querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
}
function render(){
  const home = screen==="home", fs = !home && fsMode();
  document.body.classList.toggle("fs", fs);
  document.getElementById("homeBtn").style.display = home ? "none" : "";
  document.getElementById("clock").style.display = home ? "none" : "";
  document.getElementById("nav").style.display = home ? "none" : "";
  document.getElementById("caseTitle").textContent = home ? "🕵️ 偵探檔案" : C.title;
  if (home){ document.getElementById("view").innerHTML = vHome(); return; }
  if (S.rq && tab !== "accuse"){ S.rq = false; accusePick.reasoning = {}; save(); setTimeout(()=>toast("🧩 推理題蓋起來了，剛才那一次推理機會已經用掉"), 300); }
  renderClock(); renderNav();
  let v = { brief:vBrief, suspects:vSuspects, search:vSearch, map:vMap, notes:vNotes, accuse:vAccuse, scene:()=>openSuspect?vSuspects():worldView(HOME, worldDef(HOME)) }[tab]();
  if (fs && SHEETS.includes(tab)) v = sheetWrap(v);
  // 全螢幕的頁面（筆記、推理…）自己捲動：重畫時保持原本捲到的位置
  const prev = document.querySelector(".fs-sheet"), prevTab = prev && prev.dataset.tab, prevTop = prev ? prev.scrollTop : 0;
  document.getElementById("view").innerHTML = v;
  const sh = document.querySelector(".fs-sheet"); if (sh && prevTab===sheetKey()) sh.scrollTop = prevTop;
  if (art()) drawScenes();
  if (fs) calcCover();
}
render();
if ("serviceWorker" in navigator) {
  // 有新版時自動重新載入一次，玩家不必手動清快取
  const hadSW = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", ()=>{ if (hadSW && !reloaded){ reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(r=>r.update()).catch(()=>{});
}
</script>
