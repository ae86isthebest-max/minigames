<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f3e2b5">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:,">
<title>海邊漁港</title>
<style>
  html, body { background: #f3e2b5; }
  #money { box-shadow: 0 3px 0 rgba(150, 110, 40, 0.25); }
  .sbtn.map { background: #4fb6a8; }
  .lbl.zone { text-shadow: 0 2px 0 rgba(120, 85, 30, 0.6); }
  .lbl.badge.dirty { background: rgba(120, 90, 60, 0.75); }
  .lbl.bubble.order .ii { width: 1.5em; height: 1.5em; }
  .lbl.bubble.order { font-size: 14px; padding: 2px 7px; }
  .lbl.bubble.order.late { background: #ffe0d6; }
  .lbl.bubble.order.late::after { border-top-color: #ffe0d6; }
  .lbl.event { background: rgba(30, 110, 150, 0.7); color: #fff; padding: 4px 12px; border-radius: 999px; font-weight: 900; font-size: 14px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "rbox": "./vendor/RoundedBoxGeometry.js", "bgu": "./vendor/BufferGeometryUtils.js" } }
</script>
</head>
<body>
<canvas id="cv"></canvas>
<div id="labels"></div>
<div id="ui">
  <div id="money"><span class="bill"></span><span id="moneyN">0</span></div>
  <div id="side">
    <a class="sbtn back" href="../" aria-label="返回小遊戲合集">‹</a>
    <button class="sbtn up" id="bUp" aria-label="升級"><span>⬆</span></button>
    <button class="sbtn inv" id="bInv" aria-label="倉庫"><span>📦</span></button>
    <button class="sbtn map" id="bMap" aria-label="地圖"><span>🗺</span></button>
    <button class="sbtn set" id="bSet" aria-label="設定"><span>⚙</span></button>
  </div>
  <div id="toast"></div>
</div>
<div id="panel" class="hidden">
  <div class="pcard">
    <div class="phead"><b id="pTitle"></b><button id="pClose" aria-label="關閉">×</button></div>
    <div id="pTabs"></div>
    <div id="pBody"></div>
  </div>
</div>
<script type="module" src="js/harbor.js"></script>
</body>
</html>
